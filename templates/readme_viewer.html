<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title or '文字檢視' }}</title>
  {% include '_assets_head.html' %}
  <style>
    /* Re-skinned to the shared washi tokens (was a dark-navy outlier — §3.6).
       No inline :root: every color comes from tokens.css so the page inherits
       the AA-correct palette and stays consistent with the rest of the panel. */
    body {
      margin: 0;
      padding: clamp(12px, 4vw, 24px);   /* C17: was fixed 24px (ate 13% at 375px) */
      background: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-body);
    }
    .skip-link {
      position: absolute;
      left: 12px;
      top: -48px;
      z-index: 10;
      padding: 8px 14px;
      background: var(--color-surface);
      color: var(--color-ink);
      border: 1px solid var(--line-accessible);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-2);
      transition: top var(--ease) 0.18s;
    }
    .skip-link:focus { top: 12px; }
    .shell {
      max-width: 1080px;
      margin: 0 auto;
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-2);
    }
    .header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--color-line);
      background: var(--color-surface-2);
    }
    .title {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--text-lg);
      color: var(--status-accent-text);   /* C6: AA accent text (5.29:1) */
    }
    .subtitle {
      margin: 6px 0 0;
      font-size: var(--text-sm);
      color: var(--text-faint);            /* C13: meaningful faint label, AA */
    }
    .content {
      margin: 0;
      padding: 20px;
      white-space: pre-wrap;               /* kept — honors zoom (§6 positive) */
      word-break: break-word;              /* kept — long tokens don't overflow */
      line-height: 1.6;
      font-size: var(--text-sm);
      font-family: var(--font-mono);
      color: var(--color-ink);
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <a href="#main" class="skip-link">跳到主要內容</a>
  <main id="main" class="shell" tabindex="-1">
    <div class="header">
      <h1 class="title">{{ page_title or '文字檢視' }}</h1>
      <p class="subtitle">{{ page_subtitle or '' }}</p>
    </div>
    {% if page_text %}
    <pre class="content">{{ page_text }}</pre>
    {% else %}
    {# 讀不到 update.txt（缺檔/IO 錯）-> 友善空狀態；真實錯誤只在 server log，
       絕不回顯伺服器絕對路徑（C20 info-leak）。 #}
    <div class="empty-state">
      <div class="es-icon" aria-hidden="true">📭</div>
      <p class="es-title">{{ empty_message or '目前沒有更新公告' }}</p>
    </div>
    {% endif %}
  </main>
  <script>
    const INITIAL_FRONTEND_VERSION = '{{ frontend_version }}';
    let currentFrontendVersion = INITIAL_FRONTEND_VERSION;

    async function checkFrontendVersion() {
      try {
        const response = await fetch(`/api/frontend_version?_=${Date.now()}`, { cache: 'no-store' });
        const data = await response.json();
        const nextVersion = data.version || '';
        if (!currentFrontendVersion) {
          currentFrontendVersion = nextVersion;
          return;
        }
        if (nextVersion && nextVersion !== currentFrontendVersion) {
          window.location.reload();
        }
      } catch (e) {
        console.error('frontend version check failed', e);
      }
    }

    setInterval(checkFrontendVersion, 3000);
    checkFrontendVersion();
  </script>
</body>
</html>
