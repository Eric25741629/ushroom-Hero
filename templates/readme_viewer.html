<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title or '文字檢視' }}</title>
  <style>
    :root {
      --bg-color: #10151d;
      --panel-bg: #171f2a;
      --panel-border: #2a394d;
      --title-color: #9ecbff;
      --text-color: #e5edf7;
      --muted-color: #9caabd;
    }
    body {
      margin: 0;
      padding: 24px;
      background: radial-gradient(circle at top, #162334 0%, var(--bg-color) 58%);
      color: var(--text-color);
      font-family: Consolas, "Courier New", monospace;
    }
    .shell {
      max-width: 1080px;
      margin: 0 auto;
      background: rgba(23, 31, 42, 0.96);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.28);
    }
    .header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--panel-border);
      background: linear-gradient(180deg, rgba(31, 43, 59, 0.95), rgba(19, 27, 38, 0.95));
    }
    .title {
      margin: 0;
      font-size: 1.1rem;
      color: var(--title-color);
    }
    .subtitle {
      margin: 6px 0 0;
      font-size: 0.86rem;
      color: var(--muted-color);
    }
    .content {
      margin: 0;
      padding: 20px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      font-size: 0.92rem;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <h1 class="title">{{ page_title or '文字檢視' }}</h1>
      <p class="subtitle">{{ page_subtitle or '' }}</p>
    </div>
    <pre class="content">{{ page_text }}</pre>
  </div>
  <script>
    const INITIAL_FRONTEND_VERSION = '{{ frontend_version }}';
    let currentFrontendVersion = INITIAL_FRONTEND_VERSION;

    async function checkFrontendVersion() {
      try {
        const response = await fetch(`/api/frontend_version?_=${Date.now()}`, { cache: 'no-store' });
        const data = await response.json();
        const nextVersion = data.version || '';
        if (!currentFrontendVersion) {
          currentFrontendVersion = nextVersion;
          return;
        }
        if (nextVersion && nextVersion !== currentFrontendVersion) {
          window.location.reload();
        }
      } catch (e) {
        console.error('frontend version check failed', e);
      }
    }

    setInterval(checkFrontendVersion, 3000);
    checkFrontendVersion();
  </script>
</body>
</html>
