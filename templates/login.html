<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入 - 菇勇者控制台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>if(window.top!==window.self)document.documentElement.classList.add('embedded');</script>
  {% include '_assets_head.html' %}
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Manrope", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-card {
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      border-radius: 12px;
      padding: 36px 32px;
      width: 340px;
      box-shadow: 0 8px 32px rgba(70,52,28,0.12);
    }
    .login-card h1 {
      font-family: "Sora", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: 1.3em;
      margin-bottom: 24px;
      text-align: center;
      font-weight: 700;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 0.85em;
      color: var(--color-ink-soft);
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      background: var(--color-surface-2);
      border: 1px solid var(--color-line-strong);
      border-radius: 6px;
      color: var(--color-ink);
      font-size: 0.95em;
      outline: none;
    }
    .form-group input:focus { border-color: var(--color-accent); box-shadow: 0 0 0 2px rgba(224,101,58,0.16); }
    .error {
      background: rgba(226,107,134,0.12);
      border: 1px solid var(--danger);
      color: var(--status-danger-text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85em;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: var(--color-accent-strong);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: 600;
      font-size: 0.95em;
      cursor: pointer;
    }
    button:hover { background: var(--color-accent-deep); }
    .apply-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: var(--color-ink-soft);
      font-size: 0.82em;
      text-decoration: none;
    }
    .apply-link:hover { color: var(--color-ink); }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要內容</a>
  <main id="main" class="login-card">
    <h1>菇勇者控制台</h1>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <div class="form-group">
        <label for="username">帳號</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="form-group">
        <label for="password">密碼</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit">登入</button>
    </form>
    <a href="/apply" class="apply-link">申請帳號</a>
  </main>
</body>
</html>
