<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入 - 飛寵管理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 36px 32px;
      width: 340px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .login-card h1 {
      font-size: 1.3em;
      margin-bottom: 24px;
      text-align: center;
      font-weight: 600;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 0.85em;
      color: #aaa;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 0.95em;
      outline: none;
    }
    .form-group input:focus { border-color: #66bb6a; }
    .error {
      background: rgba(239,83,80,0.15);
      border: 1px solid #ef5350;
      color: #ef5350;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85em;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #66bb6a;
      border: none;
      border-radius: 6px;
      color: #121212;
      font-weight: 600;
      font-size: 0.95em;
      cursor: pointer;
    }
    button:hover { background: #81c784; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: #aaa;
      font-size: 0.82em;
      text-decoration: none;
    }
    .back-link:hover { color: #e0e0e0; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>飛寵管理</h1>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/fly-pet/login">
      <div class="form-group">
        <label>帳號</label>
        <input type="text" name="username" autofocus required>
      </div>
      <div class="form-group">
        <label>密碼</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit">登入</button>
    </form>
    <a href="/" class="back-link">返回中控面板</a>
  </div>
</body>
</html>
