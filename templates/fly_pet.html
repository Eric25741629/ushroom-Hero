// ---- Load ----
async function doLoad(opts) {
  opts = opts || {};
  var btn = document.getElementById('loadBtn');
  var msg = document.getElementById('loadMsg');
  var launchBtn = document.getElementById('launchBtn');
  setLoading(btn, true);
  msg.textContent = '檢查連線...';
  msg.style.color = '';
  launchBtn.style.display = 'none';
  launchBtn.classList.remove('btn-attention');
  document.getElementById('initMsg').style.display = 'none';
  try {
    // 唯讀操作: 只警示,不阻擋(使用者仍須能在腳本運行中查看寵物列表)
    // opts.silent: 開頁自動載入時不跳 toast
    var guard = await botRunningGuard({block: false, silent: opts.silent});
    if (guard.bot_running) {
      var botSt = guard.botSt;
      msg.textContent = '腳本運行中: ' + (botSt.bot_task || '') + ' - ' + (botSt.bot_step || '');
      msg.style.color = 'var(--warn)';
    }
    // 輕量門檻: 先問中控台有沒有瀏覽器(不注入遊戲 JS), 沒開就立即溫和提示, 不等 5s 重探
    var br = await checkBrowserUp();
    if (!br.browser_up) {
      showNotConnectedHint('launch');
      setLoading(btn, false);
      return;
    }
    msg.textContent = '載入寵物列表...';
    var d = await apiGet('/api/fly_pet_list/' + encodeURIComponent(ip()));
    var pets = d.pets;
    if (!Array.isArray(pets)) {
      throw new Error(pets && pets.error ? pets.error : '回傳資料格式錯誤 (遊戲可能未載入)');
    }
    allPets = pets;
    selected.clear();
    entryNames.clear();
    allPets.forEach(function(p) { (p.entries||[]).forEach(function(e) { if (e.name) entryNames.add(e.name); }); });
    updateFVals();
    applyFilters();
    // 裝置可能已切換: 重載該裝置的手選收藏, 並依新 allPets 重算 STALE/成員顯示。
    loadGroups();
    renderGroupList();
    refreshBreedGroupSel();
    document.getElementById('content').style.display = 'block';
    msg.textContent = allPets.length + ' 隻';
    toast('載入 ' + allPets.length + ' 隻飛寵', 'ok');
  } catch(e) {
    var emsg = e.message || '';
    // 已過 checkBrowserUp 門檻(瀏覽器在線)卻載入失敗 = 遊戲還在載入: 溫和提示稍候, 不跳紅色錯誤
    if (emsg.indexOf('no CDP target') >= 0 || emsg.indexOf('未載入') >= 0 || emsg.indexOf('IS is not') >= 0) {
      showNotConnectedHint('loading');
    } else {
      msg.textContent = '失敗';
      msg.style.color = 'var(--danger)';
      launchBtn.style.display = 'inline-block';
      toast('載入失敗: ' + emsg, 'err');
    }
  } finally { setLoading(btn, false); }
}

// ---- Sell ----
async function doSell() {
  if (selected.size === 0) { toast('請先選擇飛寵', 'info'); return; }
  // 前端保護: 鎖定 / 已收藏 / 已上陣 一律排除 (後端 fly_pet_resolve 會再權威性過濾一次)
  var protectedIds = new Set();
  var locked = 0, collected = 0, fighting = 0, safeIds = [];
  allPets.forEach(function(p) {
    if (!selected.has(p.id)) return;
    if (p.lock === 1) { locked++; protectedIds.add(p.id); return; }
    if (p.is_collected) { collected++; protectedIds.add(p.id); return; }
    if (p.fight === 1) { fighting++; protectedIds.add(p.id); return; }
    safeIds.push(p.id);
  });
  var skipped = [];
  if (locked > 0) skipped.push(locked + ' 隻已鎖定');
  if (collected > 0) skipped.push(collected + ' 隻已收藏');
  if (fighting > 0) skipped.push(fighting + ' 隻已上陣');
  if (skipped.length) toast('已自動排除 ' + skipped.join('、'), 'info');
  if (safeIds.length === 0) {
    toast('沒有可分解的飛寵 (全部已鎖定/收藏/上陣)', 'info');
    return;
  }
  showModal('確認分解', '分解 ' + safeIds.length + ' 隻飛寵？此操作無法復原。', async function() {
    try {
      // 破壞性操作: 腳本運行中一律阻擋
      var guard = await botRunningGuard({block: true});
      if (guard.blocked) return;
      var d = await apiPost('/api/fly_pet_resolve/' + encodeURIComponent(ip()), {ids: safeIds});
      var result = d.data || {};
      if (result.ok === false) {
        toast('分解失敗: ' + (result.message || '伺服器未回應'), 'err');
        return;
      }
      toast('已分解 ' + safeIds.length + ' 隻 (剩餘 ' + (result.petCount || '?') + ')', 'ok');
      await doLoad();
    } catch(e) { toast('分解失敗: ' + e.message, 'err'); }
  });
}
function doSellOne(id) {
  var pet = allPets.find(function(p) { return p.id === id; });
  if (!pet) { toast('找不到飛寵', 'err'); return; }
  if (pet.lock === 1) { toast('此飛寵已鎖定，無法分解', 'info'); return; }
  if (pet.is_collected) { toast('此飛寵已收藏，無法分解', 'info'); return; }
  if (pet.fight === 1) { toast('此飛寵已上陣，無法分解', 'info'); return; }
  var name = pet.display_name || pet.name || 'ID:'+id;
  var info = name + ' (' + (pet.entries||[]).length + '詞條)';
  showModal('確認分解', '分解「' + info + '」？此操作無法復原。', async function() {
    try {
      // 破壞性操作: 腳本運行中一律阻擋
      var guard = await botRunningGuard({block: true});
      if (guard.blocked) return;
      var d = await apiPost('/api/fly_pet_resolve/' + encodeURIComponent(ip()), {ids: [id]});
      var result = d.data || {};
      if (result.ok === false) {
        toast('分解失敗: ' + (result.message || '伺服器未回應'), 'err');
        return;
      }
      toast('已分解「' + name + '」(剩餘 ' + (result.petCount || '?') + ')', 'ok');
      await doLoad();
    } catch(e) { toast('分解失敗: ' + e.message, 'err'); }
  });
}

// ---- Breed ----
async function loadBreed() {
  var grid = document.getElementById('breedGrid');
  grid.innerHTML = '<span class="spinner"></span>';
  try {
    // 後端 refresh 會阻塞到 EggListBack 確認資料就緒,不需固定延遲
    await fetch('/api/fly_pet_refresh_breed/' + encodeURIComponent(ip()), {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}'
    });
    var d = await apiGet('/api/fly_pet_breed_info/' + encodeURIComponent(ip()));
    var data = d.data || {};
    var homes = data.homes || [];
    var eggs = data.egg_list || [];
    if (!homes.length && !eggs.length) { grid.innerHTML = '<div style="color:var(--text2);font-size:0.85em;">沒有巢穴</div>'; return; }
    var html = '';
    homes.forEach(function(h) {
      html += '<div class="breed-slot"><b>巢穴 #' + (h.id||'?') + '</b>';
      var stateMap = {0:'閒置', 1:'孵化中', 2:'可領取', 3:'待孵化'};
      var stateLabel = stateMap[h.state] || ('state=' + h.state);
      if (h.state === 0) html += ' <span style="color:var(--text2);">' + stateLabel + '</span>';
      else if (h.state === 1) {
        var now = Math.floor(Date.now()/1000);
        var remain = h.end_time > now ? Math.ceil((h.end_time - now)/60) : 0;
        html += ' <span style="color:var(--warn);">' + stateLabel + (remain > 0 ? ' (' + remain + ' 分鐘)' : '') + '</span>';
      }
      else if (h.state === 2) html += ' <span style="color:var(--accent);">' + stateLabel + '</span> <button class="btn btn-primary btn-sm" onclick="doCollect(' + h.id + ')">領取</button>';
      else if (h.state === 3) html += ' <span style="color:var(--eq6);">' + stateLabel + '</span>';
      else html += ' <span style="color:var(--text2);">' + stateLabel + '</span>';
      var petLabel = function(p) {
        if (!p) return '(空)';
        return esc(p.display_name || p.name || 'ID:'+p.id) + ' ' + pqHTML(p.quality);
      };
      if (h.fly_a) html += '<div style="font-size:0.82em;margin-top:4px;">A: ' + petLabel(h.fly_a) + '</div>';
      if (h.fly_b) html += '<div style="font-size:0.82em;">B: ' + petLabel(h.fly_b) + '</div>';
      if (h.fly_pet) html += '<div style="font-size:0.82em;margin-top:2px;color:var(--accent);">結果: ' + petLabel(h.fly_pet) + '</div>';
      if (h._raw) {
        var extra = Object.keys(h._raw).filter(function(k) { return ['id','name','state','end_time'].indexOf(k) < 0; });
        if (extra.length) {
          var pairs = extra.map(function(k) { return k + '=' + h._raw[k]; }).join(', ');
          html += '<div style="font-size:0.72em;color:#555;margin-top:2px;">' + esc(pairs) + '</div>';
        }
      }
      html += '</div>';
    });
    if (eggs.length) {
      html += '<div class="breed-slot" style="border-color:var(--eq6);"><b>蛋列表</b> (' + eggs.length + ')<div style="font-size:0.78em;margin-top:4px;">';
      eggs.forEach(function(eg) {
        html += '<div style="margin-top:4px;">蛋 #' + esc(eg.id || '?') +
          ' <button class="btn btn-primary btn-sm" onclick="doHatch(' + Number(eg.id || 0) + ')">孵化</button>' +
          '<div style="color:var(--text2);word-break:break-all;">' + esc(JSON.stringify(eg)) + '</div></div>';
      });
      html += '</div></div>';
    }
    grid.innerHTML = html;
    renderAbSlots(homes);
    refreshBreedGroupSel();   // homes 更新後刷新「從收藏挑」選單 (供 breeding-id 過濾)
    toast('繁殖池已載入', 'ok');
  } catch(e) { grid.innerHTML = '<span style="color:var(--danger);">' + esc(e.message) + '</span>'; }
}

// 把剩餘冷卻秒數格式化成 "3h12m" / "12m" / "<1m".
function fmtRemain(sec) {
  if (sec <= 0) return '';
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  if (h > 0) return h + 'h' + m + 'm';
  if (m > 0) return m + 'm';
  return '<1m';
}
// 搭檔飛寵借用狀態標籤. state: 0=可用(可借來配), 1=繁殖中, 2=冷卻中.
// state>0 代表該飛寵正被占用/冷卻, 無法借過來配, end_time 為結束的 unix 秒.
function partnerStateLabel(state, endTime) {
  if (state === 0) return '<span style="color:var(--accent);">可用</span>';
  var name = state === 1 ? '繁殖中' : '冷卻中';
  var remain = endTime ? fmtRemain(endTime - Math.floor(Date.now() / 1000)) : '';
  return '<span style="color:var(--text2);">' + name + (remain ? ' ' + remain : '') + '</span>';
}

// ---- Partners (搭檔) ----
// 搭檔 = 繁殖搭檔 (FlyPetDataCache.role_list, 遊戲上限 30), 非好友列表.
// 每位搭檔的上架飛寵透過 /api/fly_pet_partner (send_66_24 -> RolePetListBack) 取得.
async function doLoadAllPartners() {
  var btn = document.getElementById('loadFriendsBtn');
  var prog = document.getElementById('friendsProgress');
  var result = document.getElementById('friendsResult');
  setLoading(btn, true);
  prog.textContent = '讀取搭檔列表...';
  result.innerHTML = '';

  try {
    var fd = await apiGet('/api/fly_pet_partners/' + encodeURIComponent(ip()));
    var friends = fd.partners || fd.data || [];
    if (!Array.isArray(friends)) friends = [];
    if (!friends.length) { prog.textContent = '沒有搭檔'; setLoading(btn, false); return; }

    prog.textContent = '0 / ' + friends.length + ' 搭檔';
    var loaded = 0;
    for (var i = 0; i < friends.length; i++) {
      var f = friends[i];
      prog.textContent = (i+1) + ' / ' + friends.length + ' (' + esc(f.name) + ')';
      try {
        var pd = await apiGet('/api/fly_pet_partner/' + encodeURIComponent(ip()) + '?role_id=' + f.role_id);
        var pets = pd.data || pd.pets || [];
        // 群組 partner 成員 use-time 解析快取 (role_id -> pets[]);即使 0 隻也記錄 (用於 STALE 判定)。
        partnerPetCache[f.role_id] = Array.isArray(pets) ? pets : [];
        if (!Array.isArray(pets) || pets.length === 0) continue;
        loaded++;
        var card = document.createElement('div');
        card.className = 'friend-card';
        var roleId = f.role_id, roleName = f.name || '';
        var hdr = '<div class="friend-card-hdr">' + esc(roleName) + ' - ' + pets.length + ' 隻上架</div>';
        var tbl = '<table style="width:100%;font-size:0.82em;border-collapse:collapse;">' +
          '<thead><tr><th style="text-align:left;padding:3px 6px;">名稱</th><th>品質</th><th>代數</th><th>成長</th><th>等級</th><th>詞條</th><th>狀態</th><th>收藏</th></tr></thead><tbody>';
        pets.forEach(function(p) {
          var entries = sortedEntries(p).map(function(e) { return ecHTML(e); }).join(' ');
          var growth = p.growth ? (p.growth / 10000).toFixed(2) : '0';
          // 冷卻偵測: state 0=可用(可借來配), 1=繁殖中, 2=冷卻中. state>0 一律無法借過來配.
          var stateLabel = partnerStateLabel(p.state, p.end_time);
          var pname = p.display_name || p.name || '?';
          tbl += '<tr><td style="padding:3px 6px;">' + esc(pname) + '</td>' +
            '<td style="padding:3px 6px;">' + pqHTML(p.quality) + '</td>' +
            '<td style="padding:3px 6px;text-align:center;">' + (p.generation||0) + '</td>' +
            '<td style="padding:3px 6px;text-align:center;">' + growth + '</td>' +
            '<td style="padding:3px 6px;text-align:center;">' + (p.level||0) + '</td>' +
            '<td style="padding:3px 6px;">' + (entries||'--') + '</td>' +
            '<td style="padding:3px 6px;text-align:center;">' + stateLabel + '</td>' +
            '<td style="padding:3px 6px;text-align:center;">' +
              '<button type="button" class="btn btn--ghost btn-sm" data-partner-group-add="1"' +
                ' data-role-id="' + esc(String(roleId)) + '" data-role-name="' + esc(roleName) + '"' +
                ' data-pet-id="' + (p.id||0) + '" data-config-id="' + (p.config_id||0) + '"' +
                ' data-display-name="' + esc(pname) + '"' +
                ' aria-label="把搭檔飛寵' + esc(pname) + '加入手選收藏">＋收藏</button>' +
            '</td></tr>';
        });
        tbl += '</tbody></table>';
        card.innerHTML = hdr + tbl;
        result.appendChild(card);
      } catch(e) { /* skip failed partner */ }
      await new Promise(function(r) { setTimeout(r, 300); });
    }
    prog.textContent = '完成 (' + loaded + '/' + friends.length + ' 搭檔有上架飛寵)';
    toast('搭檔飛寵載入完成', 'ok');
  } catch(e) {
    prog.textContent = '失敗';
    toast('載入搭檔失敗: ' + e.message, 'err');
  } finally { setLoading(btn, false); }
}

var abTimer = null;
var abRunning = false;
var abTicking = false;
var abLogs = {};     // per-slot: [{time, msg}]
var abHomes = [];    // cached home list from last loadBreed
var abErrors = {};   // per-slot consecutive error count

// autoBreed store: makeDeviceStore 的第一個 consumer (行為等價,型別防呆更嚴)。

function abStorageKey() { return _abStore.key(); }   // thin alias (保留外部 caller 相容)

// ---- Breeding presets (方案) ----
var abPresets = [];
var flypetCatalog = null;   // {species:[{id,name}], entries:[{id,name,quality}]}
// presets store: makeDeviceStore 的第二個 consumer。

}

function getPreset(id) {

// =====================================================================
// 手選飛寵收藏 (命名群組 收藏1/2/3…) — FLYPET_GROUPS_DESIGN
//   - 命名、持久化 (per-device localStorage),成員可混合 own + partner。
//   - 繁殖時「從收藏挑兩隻 (手選或隨機) 填入 A/B」,不用在 300+ 隻翻找。
//   - 與既有「配種方案 (preset)」「設為基底/A/B」「遊戲內 is_collected 收藏」皆獨立。
// =====================================================================

// groups store: makeDeviceStore 的第三個 consumer (非第三份 copy)。
var flypetGroups = [];
var _groupStore = makeDeviceStore('flypetGroups_', function () { return []; });
function loadGroups() {
  flypetGroups = _groupStore.load();
  if (!Array.isArray(flypetGroups)) flypetGroups = [];
}
function saveGroups() { _groupStore.save(flypetGroups); }
function genGroupId() { return 'g' + Date.now() + '_' + Math.floor(Math.random() * 1000); }

// partner pet use-time 解析快取: role_id -> RolePetListBack pets[] (doLoadAllPartners 寫入)。
var partnerPetCache = {};

// §1.3 安全旗標: partner 成員能否被自動挑/隨機當親代。
// 預設 false — 自動填入/隨機只取 own 成員 (partner 成員仍可見/可標記,但灰顯不入池),
// 直到 live 驗證 send_66_27 接受 partner pet id 才翻 true。零後端改動。
var groupsAllowPartnerParent = false;

function getGroup(id) {
  for (var i = 0; i < flypetGroups.length; i++) if (flypetGroups[i].id === id) return flypetGroups[i];
  return null;
}

// ---- 成員解析 (use-time) ----
// own 成員只存 id,從 allPets 即時解析 (避免快取腐爛);
// partner 成員存可重解析的最少欄位 + 離線顯示快取。
function resolveMember(m) {
  if (!m) return null;
  if (m.src === 'partner') {
    var pets = partnerPetCache[m.role_id];
    var live = Array.isArray(pets) ? pets.find(function (p) { return p.id === m.pet_id; }) : null;
    return {
      src: 'partner', role_id: m.role_id, role_name: m.role_name || '',
      pet: live || null,
      // 離線快取欄位 (搭檔未載入時仍能畫卡)
      display_name: (live && (live.display_name || live.name)) || m.display_name || ('ID:' + m.pet_id),
      config_id: (live && live.config_id) || m.config_id || 0,
      pet_id: m.pet_id, quality: live ? live.quality : 0,
      entries: live ? (live.entries || []) : [],
      state: live ? (live.state || 0) : -1   // -1 = 未載入
    };
  }
  // own
  var p = allPets.find(function (x) { return x.id === m.id; });
  return p ? {
    src: 'own', id: m.id, pet: p,
    display_name: p.display_name || p.name || ('ID:' + m.id),
    config_id: p.config_id || 0, quality: p.quality || 0, entries: p.entries || []
  } : { src: 'own', id: m.id, pet: null, display_name: 'ID:' + m.id, config_id: 0, quality: 0, entries: [] };
}

// STALE = 成員「失聯」(resolve 失敗): own 已分解/換裝置; partner role 被踢或那隻下架。
// STALE 成員: 灰顯 + ⚠失聯 + 可手動移除,但隨機/填入自動略過,不自動刪除。
function isStaleMember(m) {
  if (!m) return true;
  if (m.src === 'partner') {
    var pets = partnerPetCache[m.role_id];
    if (pets === undefined) return false;   // 該搭檔尚未載入 → 不武斷標 STALE
    return !pets.find(function (p) { return p.id === m.pet_id; });
  }
  return !allPets.find(function (x) { return x.id === m.id; });
}

// ---- 有效親代過濾 (重用 find_pair 略過精神: locked/fight/cooldown/breeding/STALE) ----
// 前端用 allPets 的 lock/fight + abHomes (breed_info 快取) 近似 cooldown/breeding;
// 伺服器 send_66_27 仍會權威性拒絕,前端過濾只是體驗。
function breedingPetIds() {
  var s = new Set();
  (abHomes || []).forEach(function (h) {
    if (h && h.fly_a) s.add(h.fly_a.id);
    if (h && h.fly_b) s.add(h.fly_b.id);
  });
  return s;
}
function isPickableMember(m, breedingIds) {
  if (isStaleMember(m)) return false;
  if (m.src === 'partner') {
    if (!groupsAllowPartnerParent) return false;   // 待 live 驗證,partner 不入自動池
    var r = resolveMember(m);
    return !!r.pet && r.state === 0;               // 0=可借用
  }
  var p = allPets.find(function (x) { return x.id === m.id; });
  if (!p) return false;
  if (p.lock) return false;
  if (p.fight === 1) return false;
  if (breedingIds && breedingIds.has(p.id)) return false;
  return true;
}

// ---- CRUD ----
function addToGroup(groupId, member) {
  var g = getGroup(groupId);
  if (!g) return false;
  if (!Array.isArray(g.members)) g.members = [];
  // 去重: own 比 id; partner 比 role_id+pet_id。
  var dup = g.members.some(function (m) {
    if (m.src !== member.src) return false;
    return member.src === 'partner'
      ? (m.role_id === member.role_id && m.pet_id === member.pet_id)
      : (m.id === member.id);
  });
  if (dup) return false;
  g.members.push(member);
  saveGroups();
  return true;
}
function removeFromGroup(groupId, idx) {
  var g = getGroup(groupId);
  if (!g || !Array.isArray(g.members)) return;
  g.members.splice(idx, 1);
  saveGroups();
  renderGroupList();
  refreshBreedGroupSel();
}
function renameGroup(groupId, name) {
  var g = getGroup(groupId);
  if (!g) return;
  g.name = (name || '').trim() || g.name;
  saveGroups();
  renderGroupList();
  refreshBreedGroupSel();
}
function deleteGroup(groupId) {
  flypetGroups = flypetGroups.filter(function (g) { return g.id !== groupId; });
  saveGroups();
  renderGroupList();
  refreshBreedGroupSel();
}
function groupNew() {
  var n = flypetGroups.length + 1;
  flypetGroups.push({ id: genGroupId(), name: '收藏' + n, members: [] });
  saveGroups();
  renderGroupList();
  refreshBreedGroupSel();
  toast('已新增「收藏' + n + '」', 'ok');
}
function groupRename(groupId) {
  var g = getGroup(groupId);
  if (!g) return;
  // 沿用既有 prompt-less 流程: 用瀏覽器 prompt 取新名 (a11y: 標準對話,可鍵盤操作)。
  var name = window.prompt('改名「' + g.name + '」為:', g.name);
  if (name === null) return;
  renameGroup(groupId, name);
}
async function groupDelete(groupId) {
  var g = getGroup(groupId);
  if (!g) return;
  var ok = await confirmDialog({
    title: '刪除收藏', danger: true,
    body: '刪除「' + g.name + '」(' + (g.members || []).length + ' 個成員)？成員飛寵本身不受影響。',
    okLabel: '刪除'
  });
  if (!ok) return;
  deleteGroup(groupId);
  toast('已刪除「' + g.name + '」', 'ok');
}
function groupRemoveMember(groupId, idx) {
  removeFromGroup(groupId, idx);
}

// ---- 加入收藏 (卡片/詳情共用) ----
// 開一個 lib modal 列出群組讓使用者選一組加入 (own pet)。
function openAddOwnToGroup(petId) {
  var p = allPets.find(function (x) { return x.id === petId; });

// 把搭檔飛寵加入收藏 (partner 成員: 存 role_id+pet_id + 離線顯示快取欄位)。
function openAddPartnerToGroup(member) {
  if (flypetGroups.length === 0) groupNew();
  openGroupChooser('把搭檔「' + esc(member.display_name) + '」加入收藏', function (groupId) {
    var added = addToGroup(groupId, {
      src: 'partner', role_id: member.role_id, role_name: member.role_name,
      pet_id: member.pet_id, config_id: member.config_id, display_name: member.display_name
    });
    var g = getGroup(groupId);
    if (added) { renderGroupList(); refreshBreedGroupSel(); toast('已加入「' + (g ? g.name : '') + '」', 'ok'); }
    else toast('已在「' + (g ? g.name : '') + '」內', 'info');
  });
}
// 通用「選收藏」modal (lib openModal/closeModal)。
function openGroupChooser(title, onPick) {
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  var opts = flypetGroups.map(function (g) {
    return '<button type="button" class="btn btn--secondary" data-pick-group="' + esc(g.id) + '" ' +
      'style="display:block;width:100%;text-align:left;margin:4px 0;">' +
      esc(g.name) + ' <span style="color:var(--text2);font-size:0.85em;">(' + (g.members || []).length + ' 成員)</span></button>';
  }).join('');
  overlay.innerHTML =
    '<div class="modal modal--confirm" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
      '<div class="modal-title">' + esc(title) + '</div>' +
      '<div class="modal-body" style="max-height:50vh;overflow:auto;">' + opts +
        '<button type="button" class="btn btn--ghost" data-pick-group="__new__" style="display:block;width:100%;text-align:left;margin:8px 0 2px;">＋ 新收藏…</button>' +
      '</div>' +
      '<div class="modal-row"><button type="button" class="btn btn--secondary" data-chooser-cancel="1">取消</button></div>' +
    '</div>';
  (document.body || document.documentElement).appendChild(overlay);
  function done() {
    if (typeof closeModal === 'function') closeModal(overlay); else overlay.classList.remove('active');
    setTimeout(function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 0);
  }
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay || e.target.closest('[data-chooser-cancel]')) { done(); return; }
    var b = e.target.closest('[data-pick-group]');
    if (!b) return;
    var gid = b.dataset.pickGroup;
    if (gid === '__new__') { groupNew(); gid = flypetGroups[flypetGroups.length - 1].id; }
    done();
    if (typeof onPick === 'function') onPick(gid);
  });
  overlay._uiConfirmCancel = done;   // lib 全域 Esc 關閉時當取消
  if (typeof openModal === 'function') openModal(overlay, { cls: 'active' });
  else overlay.classList.add('active');
}

// ---- 收藏管理面板渲染 ----
function memberChipHTML(groupId, m, idx) {
  var r = resolveMember(m);
  var stale = isStaleMember(m);
  var pfx = m.src === 'partner' ? '🤝 ' : '';
  var roleTag = (m.src === 'partner' && r.role_name) ? '<span style="color:var(--text2);font-size:0.85em;">·' + esc(r.role_name) + '</span>' : '';
  var staleTag = stale ? '<span style="color:var(--danger);font-weight:700;" title="此成員已失聯,挑選時自動略過">⚠失聯</span>' : '';
  var sty = stale ? 'opacity:0.55;' : '';
  return '<span class="chip" style="' + sty + '">' +
    pfx + esc(r.display_name) + ' ' + roleTag + ' ' + staleTag +
    '<button type="button" class="chip-x" data-group-rm-member="' + idx + '" data-group-id="' + esc(groupId) +
      '" aria-label="從此收藏移除' + esc(r.display_name) + '" title="移除">&times;</button>' +
    '</span>';
}
function renderGroupList() {
  var el = document.getElementById('groupList');
  if (!el) return;
  if (flypetGroups.length === 0) {
    el.innerHTML = '<div class="empty-state" style="padding:18px;"><div class="es-title">尚無收藏</div>' +
      '<div class="es-hint">點「＋ 新增收藏」建立,再到飛寵卡片或詳情按「＋收藏」加入成員。</div></div>';
    return;
  }
  el.innerHTML = flypetGroups.map(function (g) {
    var members = g.members || [];
    var chips = members.length
      ? members.map(function (m, i) { return memberChipHTML(g.id, m, i); }).join('')
      : '<div class="empty-state" style="padding:12px;"><div class="es-hint">這個收藏還沒有成員 — 到卡片或詳情按「＋收藏」加入。</div></div>';
    return '<div class="card" style="margin-top:10px;padding:12px;">' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;">' +
        '<strong style="font-size:0.92em;">' + esc(g.name) + '</strong>' +
        '<span style="color:var(--text2);font-size:0.82em;">' + members.length + ' 成員</span>' +
        '<span style="margin-left:auto;display:flex;gap:6px;">' +
          '<button type="button" class="btn btn--ghost btn-sm" data-group-rename="' + esc(g.id) + '">改名</button>' +
          '<button type="button" class="btn btn--danger btn-sm" data-group-delete="' + esc(g.id) + '">刪除</button>' +
        '</span>' +
      '</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:6px;">' + chips + '</div>' +
    '</div>';
  }).join('');
}

// ---- 繁殖表單整合 ----
function refreshBreedGroupSel() {
  var sel = document.getElementById('breedGroupSel');
  if (!sel) return;
  var prev = sel.value;
  if (flypetGroups.length === 0) {
    sel.innerHTML = '<option value="">（尚無收藏）</option>';
    return;
  }
  sel.innerHTML = flypetGroups.map(function (g) {
    return '<option value="' + esc(g.id) + '">' + esc(g.name) + ' (' + (g.members || []).length + ')</option>';
  }).join('');
  if (prev && getGroup(prev)) sel.value = prev;
}
// 取選中群組的「可挑」成員 (own + 視旗標 partner),已過濾 STALE/locked/fight/breeding。
function pickableMembersOfSelectedGroup() {
  var sel = document.getElementById('breedGroupSel');
  var g = sel ? getGroup(sel.value) : null;
  if (!g) return { group: null, list: [] };
  var breeding = breedingPetIds();
  var list = (g.members || []).filter(function (m) { return isPickableMember(m, breeding); });
  return { group: g, list: list };
}
// 填入 A / 填入 B: 列出成員讓使用者手選一隻 → setBreedPet(slot, id)。
// 非 STALE 成員都列出; 不可挑者 (鎖定/出戰/繁殖中, 或旗標關時的 partner) 灰顯+disabled+tooltip。
function fillBreedFromGroup(slot) {
  var sel = document.getElementById('breedGroupSel');
  var g = sel ? getGroup(sel.value) : null;
  if (!g) { toast('請先選擇一個收藏', 'info'); return; }
  var breeding = breedingPetIds();
  var members = (g.members || []).filter(function (m) { return !isStaleMember(m); });
  if (members.length === 0) { toast('「' + g.name + '」沒有可顯示的成員 (全部失聯)', 'err'); return; }
  var anyPickable = members.some(function (m) { return isPickableMember(m, breeding); });
  if (!anyPickable) { toast('「' + g.name + '」沒有可用成員 (已排除鎖定/出戰/繁殖中/失聯)', 'err'); return; }
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  var rows = members.map(function (m) {
    var rm = resolveMember(m);
    var pfx = m.src === 'partner' ? '🤝 ' : '';
    var pid = m.src === 'partner' ? m.pet_id : m.id;
    var pickable = isPickableMember(m, breeding);
    // partner 不可挑且旗標關 → tooltip 標「待驗證」; own 不可挑 → 鎖定/出戰/繁殖中。
    var why = '';
    if (!pickable) {
      if (m.src === 'partner' && !groupsAllowPartnerParent) why = '搭檔當親代待驗證';
      else why = '不可用（鎖定/出戰/繁殖中）';
    }
    var dis = pickable ? '' : ' disabled aria-disabled="true" title="' + esc(why) + '" style="opacity:0.5;"';
    return '<button type="button" class="btn btn--secondary"' +
      (pickable ? ' data-fill-pet="' + pid + '"' : '') + dis +
      ' style="display:block;width:100%;text-align:left;margin:4px 0;' + (pickable ? '' : 'opacity:0.5;') + '">' +
      pfx + esc(rm.display_name) + ' <span style="color:var(--text2);font-size:0.85em;">#' + pid +
      (why ? ' · ' + esc(why) : '') + '</span></button>';
  }).join('');
  overlay.innerHTML =
    '<div class="modal modal--confirm" role="dialog" aria-modal="true" aria-label="從收藏填入 ' + slot + '">' +
      '<div class="modal-title">從「' + esc(g.name) + '」填入 ' + slot + '</div>' +
      '<div class="modal-body" style="max-height:50vh;overflow:auto;">' + rows + '</div>' +
      '<div class="modal-row"><button type="button" class="btn btn--secondary" data-fill-cancel="1">取消</button></div>' +
    '</div>';
  (document.body || document.documentElement).appendChild(overlay);
  function done() {
    if (typeof closeModal === 'function') closeModal(overlay); else overlay.classList.remove('active');
    setTimeout(function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 0);
  }
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay || e.target.closest('[data-fill-cancel]')) { done(); return; }
    var b = e.target.closest('[data-fill-pet]');
    if (!b) return;
    done();
    setBreedPet(slot, +b.dataset.fillPet);
  });
  overlay._uiConfirmCancel = done;
  if (typeof openModal === 'function') openModal(overlay, { cls: 'active' });
  else overlay.classList.add('active');
}
// 隨機自動挑 A/B: 從可挑成員隨機不重複抽兩隻 → setBreedPet('A',a) + setBreedPet('B',b)。
function pickRandomFromGroup() {
  var r = pickableMembersOfSelectedGroup();
  if (!r.group) { toast('請先選擇一個收藏', 'info'); return; }
  if (r.list.length < 2) { toast('「' + r.group.name + '」可用成員不足兩隻 (已排除鎖定/出戰/繁殖中/失聯)', 'err'); return; }
  var pool = r.list.slice();
  // ponytail: when groupsAllowPartnerParent is enabled, dedupe the random pool by composite (src+id) and assert A!==B before setBreedPet — today pool is all-own + dedup'd so A!=B holds.
  // Fisher-Yates 抽前兩個。
  for (var i = pool.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  // own 用 id; partner 用 pet_id (= info.id)。
  var a = pool[0].src === 'partner' ? pool[0].pet_id : pool[0].id;
  var b = pool[1].src === 'partner' ? pool[1].pet_id : pool[1].id;
  setBreedPet('A', a);
  setBreedPet('B', b);
  toast('已從「' + r.group.name + '」隨機挑兩隻填入 A/B', 'ok');
}

// ---- 收藏面板 + 繁殖表單群組鈕 事件綁定 (delegated, 只綁一次) ----
function initGroups() {
  var list = document.getElementById('groupList');
  if (list && !list._wired) {
    list._wired = true;
    list.addEventListener('click', function (e) {
      var rn = e.target.closest('[data-group-rename]');
      if (rn) { groupRename(rn.dataset.groupRename); return; }
      var del = e.target.closest('[data-group-delete]');
      if (del) { groupDelete(del.dataset.groupDelete); return; }
      var rm = e.target.closest('[data-group-rm-member]');
      if (rm) { groupRemoveMember(rm.dataset.groupId, +rm.dataset.groupRmMember); return; }
    });
  }
  var friends = document.getElementById('friendsResult');
  if (friends && !friends._wired) {
    friends._wired = true;
    friends.addEventListener('click', function (e) {
      var b = e.target.closest('[data-partner-group-add]');
      if (!b) return;
      openAddPartnerToGroup({
        role_id: Number(b.dataset.roleId), role_name: b.dataset.roleName || '',
        pet_id: Number(b.dataset.petId), config_id: Number(b.dataset.configId),
        display_name: b.dataset.displayName || ('ID:' + b.dataset.petId)
      });
    });
  }
  var breedRow = document.getElementById('breedGroupSel');
  if (breedRow && breedRow.parentNode && !breedRow.parentNode._wired) {

      var fill = e.target.closest('[data-group-fill]');
      if (fill) { fillBreedFromGroup(fill.dataset.groupFill); return; }

    });
  }
}

async function ensureCatalog() {
  if (flypetCatalog) return flypetCatalog;
  try {
    var d = await apiGet('/api/fly_pet_catalog/' + encodeURIComponent(ip()));
    flypetCatalog = (d && d.data) ? d.data : { species: [], entries: [] };
  } catch(e) {
    // Degrade: derive from currently owned pets if the live catalog is unreachable.
    var spMap = {}, enMap = {};
    (allPets || []).forEach(function(p) {
      if (p.config_id != null) spMap[p.config_id] = p.display_name || p.name || ('#' + p.config_id);
      (p.entries || []).forEach(function(e) { if (e.id != null) enMap[e.id] = {name: e.name, quality: e.quality}; });
    });
    flypetCatalog = {
      species: Object.keys(spMap).map(function(k) { return {id: Number(k), name: spMap[k]}; }),
      entries: Object.keys(enMap).map(function(k) { return {id: Number(k), name: enMap[k].name, quality: enMap[k].quality}; })
    };
  }
  return flypetCatalog;
}

// Convert a 1.x inline-criteria abConfig into named presets so existing
// per-slot settings survive the migration to the preset model.
function migrateLegacyAbConfig() {
  if (abPresets.length > 0) return;
  var made = false;
  Object.keys(abConfig).forEach(function(hid) {
    var c = abConfig[hid];
    if (!c || c.preset_id) return;
    if (c.mode || c.quality || c.min_count) {
      var pid = genPresetId();
      abPresets.push({
        id: pid, name: '舊設定 #' + hid,
        species_whitelist: [], entry_whitelist: [],
        mode: c.mode || 'quality_count',
        quality: c.quality || 3,
        min_count: c.min_count || 2,
        min_total_entries: c.min_total_entries || 3,
        prefer_low_gen: c.prefer_low_gen !== false
      });
      c.preset_id = pid;
      made = true;
    }
  });
  if (made) { savePresets(); saveAbConfig(); }
}

function presetCriteria(presetId) {
  var p = getPreset(presetId);
  if (!p) return null;
  return {
    mode: p.mode || 'quality_count',
    quality: p.quality || 3,
    min_count: p.min_count || 2,
    min_total_entries: p.min_total_entries || 3,
    prefer_low_gen: p.prefer_low_gen !== false,
    species_whitelist: p.species_whitelist || [],
    entry_whitelist: p.entry_whitelist || []
  };
}

function renderPresetList() {

    var sp = (p.species_whitelist || []).length;

      '<button class="btn btn-ghost btn-sm" onclick="presetDelete(\'' + p.id + '\')">刪除</button>' +

}

function abLog(homeId, msg) {
  if (!abLogs[homeId]) abLogs[homeId] = [];

  var ts = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
  abLogs[homeId].unshift({time: ts, msg: msg});
  if (abLogs[homeId].length > 10) abLogs[homeId].length = 10;
  renderAbLogUI(homeId);
}

  if (!el) return;
  el.className = 'ab-status ab-status-' + cls;
  el.textContent = text;

function startAutoBreed() {
  if (abRunning) return;
  loadAbConfig();
  loadPresets();
  var anyEnabled = Object.values(abConfig).some(function(c) { return c.enabled; });
  if (!anyEnabled) { toast('請先勾選至少一個巢穴', 'info'); return; }
  abRunning = true;
  abErrors = {};
  document.getElementById('abStartBtn').style.display = 'none';
  document.getElementById('abStopBtn').style.display = '';
  document.getElementById('abGlobalStatus').textContent = '運行中';
  document.getElementById('abGlobalStatus').style.color = 'var(--accent)';
  document.querySelectorAll('.ab-slot').forEach(function(el) {
    var id = el.id.replace('abSlot_', '');
    if (abConfig[id] && abConfig[id].enabled) el.classList.add('active');
  });
  toast('自動繁殖已啟動', 'ok');
  autoBreedTick();
  abTimer = setInterval(autoBreedTick, 15000);
}

function stopAutoBreed() {
  abRunning = false;
  abTicking = false;
  if (abTimer) { clearInterval(abTimer); abTimer = null; }
  document.getElementById('abStartBtn').style.display = '';
  document.getElementById('abStopBtn').style.display = 'none';
  document.getElementById('abGlobalStatus').textContent = '已停止';
  document.getElementById('abGlobalStatus').style.color = 'var(--text2)';
  document.querySelectorAll('.ab-slot').forEach(function(el) { el.classList.remove('active'); });
  abHomes.forEach(function(h) { abSetStatus(h.id, 'off', '已停止'); });
  toast('自動繁殖已停止', 'info');
}

async function autoBreedTick() {
  if (!abRunning) return;
  if (abTicking) return;
  abTicking = true;
  loadAbConfig();
  loadPresets();

  try {
    try {
      var botSt = await checkBotRunning();
      if (botSt.bot_running) {
        document.getElementById('abGlobalStatus').textContent = '暫停 (腳本運行中: ' + (botSt.bot_task || '') + ')';
        document.getElementById('abGlobalStatus').style.color = 'var(--warn)';
        return;
      }
    } catch(e) {}

    // 後端 refresh 會阻塞到 EggListBack 確認資料就緒,不需固定延遲
    try {
      await fetch('/api/fly_pet_refresh_breed/' + encodeURIComponent(ip()), {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}'
      });
    } catch(e) {}

    var breedData;
    try {
      var d = await apiGet('/api/fly_pet_breed_info/' + encodeURIComponent(ip()));
      breedData = d.data || {};
    } catch(e) {
      document.getElementById('abGlobalStatus').textContent = '錯誤: ' + e.message;
      document.getElementById('abGlobalStatus').style.color = 'var(--danger)';
      return;
    }

    var homes = breedData.homes || [];
    // 每輪用丟棄式副本: processAbSlot 會 .shift() 取蛋,不可汙染 breedData.egg_list
    var eggs = (breedData.egg_list || []).slice();
    var excludeIds = [];

    for (var i = 0; i < homes.length; i++) {
      if (homes[i].fly_a) excludeIds.push(homes[i].fly_a.id);
      if (homes[i].fly_b) excludeIds.push(homes[i].fly_b.id);
    }

    for (var i = 0; i < homes.length; i++) {
      var h = homes[i];
      var cfg = abConfig[h.id];
      if (!cfg || !cfg.enabled) {
        abSetStatus(h.id, 'off', '未啟用');
        continue;
      }

      try {
        await processAbSlot(h, cfg, excludeIds, eggs);
        abErrors[h.id] = 0;
      } catch(e) {
        abErrors[h.id] = (abErrors[h.id] || 0) + 1;
        abSetStatus(h.id, 'error', '錯誤: ' + e.message);
        abLog(h.id, '錯誤: ' + e.message);
        if (abErrors[h.id] >= 3) {
          abConfig[h.id].enabled = false;
          saveAbConfig();
          abLog(h.id, '連續失敗 3 次，已停用此巢穴');
          var ck = document.querySelector('#abSlot_' + h.id + ' input[type=checkbox]');
          if (ck) ck.checked = false;
        }
      }
    }

    var ts = new Date();
    document.getElementById('abGlobalStatus').textContent = '運行中 (上次: ' +
      String(ts.getHours()).padStart(2,'0') + ':' + String(ts.getMinutes()).padStart(2,'0') + ':' + String(ts.getSeconds()).padStart(2,'0') + ')';
    document.getElementById('abGlobalStatus').style.color = 'var(--accent)';
  } finally {
    abTicking = false;
  }
}

async function processAbSlot(home, cfg, excludeIds, eggs) {
  var hid = home.id;

  if (home.state === 2) {
    abSetStatus(hid, 'ready', '領取中...');
    await apiPost('/api/fly_pet_breed_collect/' + encodeURIComponent(ip()), {base_id: hid});
    abLog(hid, '已領取繁殖結果');
    abSetStatus(hid, 'idle', '已領取，等待下一輪');
    return;
  }

  if (home.state === 3) {
    if (!eggs || eggs.length === 0) {
      abSetStatus(hid, 'ready', '待孵化，沒有蛋');
      return;
    }
    var egg = eggs.shift();
    abSetStatus(hid, 'ready', '孵化中...');
    await apiPost('/api/fly_pet_hatch/' + encodeURIComponent(ip()), {egg_id: egg.id});
    abLog(hid, '已送出孵化請求');
    abSetStatus(hid, 'breeding', '孵化中');
    return;
  }

  if (home.state === 1) {
    var now = Math.floor(Date.now() / 1000);
    var remain = home.end_time > now ? Math.ceil((home.end_time - now) / 60) : 0;
    abSetStatus(hid, 'breeding', '繁殖中' + (remain > 0 ? ' (' + remain + ' 分鐘)' : ''));
    return;
  }

  if (home.state === 0) {
    var criteria = presetCriteria(cfg.preset_id);
    if (!criteria) {
      abSetStatus(hid, 'idle', '未選方案');
      return;
    }
    abSetStatus(hid, 'idle', '搜尋配對...');

    var pd = await apiPost('/api/fly_pet_find_pair/' + encodeURIComponent(ip()), {
      criteria: criteria,
      exclude_ids: excludeIds
    });
    var result = pd.data || {};
    if (result.error) {
      abLog(hid, '搜尋錯誤: ' + result.error);
      abSetStatus(hid, 'error', '搜尋錯誤');
      return;
    }
    if (!result.pair) {
      abLog(hid, '找不到配對 (符合 ' + (result.candidates_count || 0) + ', 冷卻 ' + (result.skipped_cooldown || 0) + ')');
      abSetStatus(hid, 'idle', '無可用配對 (' + (result.candidates_count || 0) + ' 符合, ' + (result.skipped_cooldown || 0) + ' 冷卻)');
      return;
    }

    var pa = result.pair.fly_a;
    var pb = result.pair.fly_b;
    excludeIds.push(pa.id, pb.id);

    abSetStatus(hid, 'breeding', '開始繁殖...');
    await apiPost('/api/fly_pet_breed_start/' + encodeURIComponent(ip()), {
      base_id: hid, fly_a_id: pa.id, fly_b_id: pb.id
    });
    abLog(hid, '開始繁殖: ' + (pa.display_name||pa.name) + '(G' + pa.generation + ') + ' + (pb.display_name||pb.name) + '(G' + pb.generation + ')');
    abSetStatus(hid, 'breeding', '已開始繁殖');
  }
}

// ---- Init ----
document.addEventListener('DOMContentLoaded', function() {
  initGallery();    // 綁定卡片牆/種類欄/抽屜事件 (只綁一次)
  initGroups();     // 綁定收藏面板 + 繁殖表單群組鈕 (只綁一次)
  loadGroups();     // 載入手選收藏 (per-device localStorage)
  renderGroupList();
  refreshBreedGroupSel();
  syncPresetUI();
  updateFVals();
  initAutoLoad();   // 靜默偵測: 能連就載入, 未連線安靜提示(不預設瀏覽器已開)
});
</script>
