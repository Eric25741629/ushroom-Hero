<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>飛寵管理 - 菇勇者全自動掛機</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>if(window.top!==window.self)document.documentElement.classList.add('embedded');</script>
  {% include '_assets_head.html' %}
  <style>
    /* Design tokens now come from static/lib/tokens.css (all old var names
       --bg/--accent/--muted/--eq*/--pq*/etc. are aliased there to AA values).
       The inline :root block was removed in Phase 3 so this page routes
       through the accessible tokens. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Manrope", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(180deg, #fbf3e8 0, var(--bg) 300px);
      color: var(--text);
      line-height: 1.5;
    }
    .topbar h1, h1, h2, h3 { font-family: "Sora", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ddd2bd; border-radius: 3px; }

    /* Layout */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255, 255, 255, 0.96); border-bottom: 1px solid var(--border);
      padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      box-shadow: 0 10px 28px rgba(70,52,28,0.10);
    }
    html.embedded .topbar a[href="/"] { display: none; }
    .topbar h1 { font-size: 1.15em; font-weight: 700; white-space: nowrap; letter-spacing: 0; }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .topbar a { color: var(--text2); text-decoration: none; font-size: 0.82em; }
    .topbar a:hover { color: var(--text); }
    .main { padding: 18px 20px 28px; max-width: 1480px; margin: 0 auto; }

    /* Controls */
    select, input[type="text"], input[type="number"] {
      background: var(--surface3); border: 1px solid var(--border); color: var(--text);
      padding: 7px 10px; border-radius: 6px; font-size: 0.88em; outline: none;
      min-height: 32px;
    }
    select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(224,101,58,0.16); }
    .btn {
      padding: 7px 14px; border: 1px solid transparent; border-radius: 6px; font-size: 0.85em;
      cursor: pointer; font-weight: 650; transition: background 0.15s, border-color 0.15s, color 0.15s;
      min-height: 32px;
    }
    .btn-primary { background: linear-gradient(135deg, var(--color-accent-strong), var(--color-accent-deep)); color: #fff; }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: var(--danger-h); }
    .btn-ghost { background: rgba(43,38,32,0.03); color: var(--text2); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); border-color: var(--border2); }
    .btn-sm { padding: 5px 10px; font-size: 0.8em; min-height: 28px; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    /* 未連線時 highlight 「啟動瀏覽器」按鈕：accent 邊框 + 柔和呼吸光暈 */
    .btn-attention { border-color: var(--accent); color: var(--accent-h); animation: attentionPulse 1.6s ease-in-out infinite; }
    @keyframes attentionPulse { 0%,100% { box-shadow: 0 0 0 0 var(--accent-soft); } 50% { box-shadow: 0 0 0 4px var(--accent-soft); } }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Preset filter toggles */
    .preset-bar {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center;
      background: rgba(255,255,255,0.7); border: 1px solid #ece3d3;
      border-radius: 8px; padding: 10px;
    }
    .preset-toggle {
      padding: 5px 12px; border-radius: 6px; font-size: 0.82em; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface2); color: var(--text2);
      transition: all 0.15s; user-select: none;
    }
    .preset-toggle.active { background: var(--accent-soft); color: var(--accent-h); border-color: rgba(224,101,58,0.55); font-weight: 700; }
    .preset-toggle:hover:not(.active) { background: var(--surface3); color: var(--text); }
    .preset-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .stat {
      font-size: 0.82em; color: var(--text2); background: rgba(255,255,255,0.68);
      border: 1px solid rgba(236,227,211,0.9); border-radius: 8px; padding: 8px 10px;
    }
    .stat b { color: var(--accent-h); margin-left: 4px; font-size: 1.08em; }

    /* Advanced filter */
    .filter-row {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px;
      background: rgba(255,255,255,0.56); border: 1px solid rgba(236,227,211,0.8);
      border-radius: 8px; padding: 10px;
    }
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: 6px; font-size: 0.78em;
      background: var(--surface3); border: 1px solid var(--border);
    }
    .chip-x { cursor: pointer; color: var(--text2); font-weight: bold; margin-left: 2px; }
    .chip-x:hover { color: var(--danger); }

    /* Table */
    .tbl-wrap {
      overflow-x: auto; margin-bottom: 16px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--surface4);
    }
    table { width: 100%; min-width: 1120px; border-collapse: collapse; font-size: 0.85em; }
    thead { position: sticky; top: 0; z-index: 2; }
    th {
      background: #f0e9da; padding: 9px 10px; text-align: left; font-weight: 700;
      font-size: 0.8em; color: var(--text2); border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--text); }
    th.sortable .sort-arrow { font-size: 0.7em; margin-left: 3px; color: var(--accent); }
    td { padding: 8px 10px; border-bottom: 1px solid rgba(236,227,211,0.7); vertical-align: middle; }
    tbody tr:nth-child(even) td { background: rgba(43,38,32,0.015); }
    tr:hover td { background: rgba(74,160,221,0.07); }
    tr.selected td { background: rgba(224,101,58,0.10); }
    .col-ck { width: 32px; text-align: center; }
    .col-sm { width: 50px; text-align: center; }
    .col-ops { width: 110px; text-align: center; }
    .pet-name { font-weight: 700; color: var(--text); }
    .pet-id { color: var(--muted); font-size: 0.74em; margin-left: 6px; }

    /* Entry chip */
    .ec {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px;
      border-radius: 5px; font-size: 0.8em; margin: 2px 2px; white-space: nowrap;
      border: 1px solid transparent; min-height: 23px;
    }
    /* §3.2a: entry-tag chip TEXT darkened to a >=4.5:1 shade of each hue
       (saturated pastel moved to the border/bg only). */
    .ec-1 { background: rgba(100,181,246,0.13); color: #1d6fb8; border-color: rgba(100,181,246,0.22); }
    .ec-2 { background: rgba(255,213,79,0.16); color: #8a6d00; border-color: rgba(255,213,79,0.25); }
    .ec-3 {
      font-weight: 800; color: #8a6d00;
      background: linear-gradient(135deg, rgba(96,165,250,0.24), rgba(246,196,83,0.22));
      border: 1px solid rgba(246,196,83,0.48);
      box-shadow: inset 0 0 0 1px rgba(96,165,250,0.10);
    }
    .ec-4 { background: rgba(239,83,80,0.16); color: #b91c1c; border-color: rgba(239,83,80,0.30); text-decoration: line-through; }
    .ec-5 { background: rgba(126,87,194,0.18); color: #6d28d9; border-color: rgba(126,87,194,0.34); }
    .ec-6 { background: rgba(224,64,251,0.18); color: #a21caf; border-color: rgba(224,64,251,0.36); font-weight: 800; }
    .ec-7 { background: rgba(38,166,154,0.18); color: #0f766e; border-color: rgba(38,166,154,0.36); font-weight: 700; }

    /* Pet quality badge */
    .pq {
      display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 0.78em;
      font-weight: 800; border: 1px solid transparent; min-width: 34px; text-align: center;
    }
    /* §3.2a: quality-badge TEXT darkened to AA shade of each hue (bright hue -> border). */
    .pq-0 { background: rgba(153,153,153,0.15); color: #5f5f5f; border-color: rgba(153,153,153,0.24); }
    .pq-1 { background: rgba(100,181,246,0.16); color: #1d6fb8; border-color: rgba(100,181,246,0.28); }
    .pq-2 { background: rgba(206,147,216,0.18); color: #9333a8; border-color: rgba(206,147,216,0.30); }
    .pq-3 { background: rgba(255,213,79,0.20); color: #8a6d00; border-color: rgba(255,213,79,0.38); }

    /* Action bar */
    .action-row {
      display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
      background: rgba(255,255,255,0.5); border: 1px solid rgba(236,227,211,0.75);
      border-radius: 8px; padding: 10px;
    }
    .sel-count { font-size: 0.82em; color: var(--text2); }

    /* Section card */
    .section {
      background: rgba(255,255,255,0.96); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; margin-bottom: 16px; box-shadow: 0 14px 34px rgba(70,52,28,0.10);
    }
    .section-title { font-size: 0.95em; font-weight: 800; margin-bottom: 10px; }
    .section-sub { font-size: 0.82em; color: var(--text2); margin-bottom: 8px; }
    .collapse-hdr { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .collapse-hdr .arrow { color: var(--text2); font-size: 0.75em; transition: transform 0.2s; }
    .collapse-hdr.open .arrow { transform: rotate(90deg); }
    .collapse-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
    .collapse-body.open { max-height: none; overflow: visible; }

    /* Breed grid */
    .breed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-top: 10px; }
    .breed-slot { background: var(--surface3); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 0.85em; }

    /* Friend pets */
    .friend-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    .friend-card { background: var(--surface3); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .friend-card-hdr { font-weight: 600; font-size: 0.88em; margin-bottom: 6px; }

    /* Toast */
    .toast-box { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 6px; }
    .toast {
      padding: 8px 16px; border-radius: 6px; font-size: 0.82em; color: #fff;
      animation: toastIn 0.2s ease; min-width: 200px;
    }
    .toast-ok { background: var(--status-ok-fill); }
    .toast-err { background: var(--danger-h); }
    .toast-info { background: #6f6657; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

    /* Modal */
    .modal-bg {
      display: none; position: fixed; inset: 0; background: rgba(43,38,32,0.45);
      z-index: 8000; justify-content: center; align-items: center;
    }
    .modal-bg.show { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 22px; min-width: 340px; max-width: 440px; box-shadow: 0 8px 32px rgba(70,52,28,0.22);
    }
    .modal h3 { margin-bottom: 10px; font-size: 1em; }
    .modal p { color: var(--text2); font-size: 0.88em; margin-bottom: 18px; white-space: pre-line; }
    .modal-btns { display: flex; justify-content: flex-end; gap: 8px; }

    /* Empty */
    .empty { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 0.9em; }

    /* Auto-breed */
    .ab-panel { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 12px; }
    .ab-slot { background: var(--surface3); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
    .ab-slot.active { border-color: var(--accent); }
    .ab-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.82em; }
    .ab-row + .ab-row { margin-top: 6px; }
    .ab-status { font-size: 0.78em; padding: 2px 8px; border-radius: 10px; }
    .ab-status-idle { background: rgba(153,153,153,0.15); color: var(--text2); }
    .ab-status-breeding { background: rgba(255,167,38,0.15); color: var(--warn); }
    .ab-status-ready { background: rgba(102,187,106,0.15); color: var(--accent); }
    .ab-status-error { background: rgba(239,83,80,0.15); color: var(--danger); }
    .ab-status-off { background: transparent; color: var(--muted); }
    .ab-log { font-size: 0.72em; color: var(--muted); max-height: 60px; overflow-y: auto; margin-top: 4px; line-height: 1.4; }
    .ab-log div { border-bottom: 1px solid var(--border); padding: 1px 0; }
    .ab-controls { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }

    @media (max-width: 768px) {
      .topbar { padding: 8px 12px; }
      .main { padding: 10px 12px; }
    }

    /* =======================================================================
       飛寵列表重設計 (B 卡片牆 + C 種類欄)
       所有 token / 規則都 scope 在 .flypet-gallery 與 #gallery* 容器內,
       不污染既有 :root 變數,也不影響繁殖/搭檔區。
       ======================================================================= */
    .flypet-gallery {
      /* --fg-*, --pqc-*, --eqc-* tokens removed (Phase 3): all aliased in
         tokens.css :root to AA values (--fg-amber/--fg-txt-faint now deep,
         chip text uses --chip-text below). */
      position: relative;
    }

    /* Stats */
    .flypet-gallery .fg-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin: 10px 0 12px; }
    .flypet-gallery .fg-stat { font-size: 0.82em; color: var(--fg-txt-dim); background: var(--fg-bg-2); border: 1px solid var(--fg-line); border-radius: 10px; padding: 8px 11px; }
    .flypet-gallery .fg-stat b { color: var(--status-accent-text); margin-left: 4px; font-size: 1.1em; }

    /* Rail (search + view toggle + advanced) */
    .flypet-gallery .fg-rail { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    .flypet-gallery .fg-search { flex: 1; min-width: 220px; position: relative; display: flex; align-items: center; }
    .flypet-gallery .fg-si { position: absolute; left: 13px; font-size: 14px; color: var(--fg-txt-faint); pointer-events: none; }
    .flypet-gallery .fg-search input { width: 100%; height: 42px; background: var(--fg-panel); border: 1px solid var(--fg-line); border-radius: 12px; color: var(--fg-txt); font-size: 14px; padding: 0 38px 0 36px; outline: none; transition: .15s; }
    .flypet-gallery .fg-search input:focus { border-color: var(--fg-accent); box-shadow: 0 0 0 3px rgba(224,101,58,.15); }
    .flypet-gallery .fg-search-clear { position: absolute; right: 8px; width: 26px; height: 26px; border: none; background: transparent; color: var(--fg-txt-faint); border-radius: 8px; font-size: 16px; cursor: pointer; display: none; }
    .flypet-gallery .fg-search-clear.show { display: grid; place-items: center; }
    .flypet-gallery .fg-search-clear:hover { background: var(--fg-panel-2); color: var(--fg-txt); }
    .flypet-gallery .fg-view-toggle { display: flex; background: var(--fg-panel); border: 1px solid var(--fg-line); border-radius: 12px; padding: 3px; gap: 2px; height: 44px; }
    .flypet-gallery .fg-view-toggle button { padding: 0 14px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--fg-txt-dim); background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .flypet-gallery .fg-view-toggle button.on { background: linear-gradient(135deg, var(--fg-accent), var(--fg-accent-2)); color: #fff; }
    .flypet-gallery .fg-view-toggle button:not(.on):hover { color: var(--fg-txt); }
    .flypet-gallery .fg-filter-btn { height: 42px; padding: 0 15px; border-radius: 12px; background: var(--fg-panel); border: 1px solid var(--fg-line); cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--fg-txt-dim); }
    .flypet-gallery .fg-filter-btn:hover { border-color: var(--fg-accent); color: var(--fg-txt); }
    .flypet-gallery .fg-filter-btn .badge { background: var(--fg-accent); color: #fff; font-size: 11px; font-weight: 800; border-radius: 20px; padding: 1px 7px; min-width: 18px; text-align: center; }

    /* Quick chips */
    .flypet-gallery .fg-quick { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .flypet-gallery .fg-quick-grp { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .flypet-gallery .fg-glabel { font-size: 11px; color: var(--fg-txt-faint); margin-right: 2px; }
    .flypet-gallery .pq-chip, .flypet-gallery .eq-chip { height: 32px; padding: 0 11px; border-radius: 9px; border: 1px solid var(--fg-line); background: var(--fg-panel); cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--fg-txt-dim); }
    .flypet-gallery .pq-chip .dot, .flypet-gallery .eq-chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
    .flypet-gallery .pq-chip:hover, .flypet-gallery .eq-chip:hover { color: var(--fg-txt); border-color: var(--fg-txt-faint); }
    .flypet-gallery .pq-chip.on, .flypet-gallery .eq-chip.on { color: var(--fg-txt); box-shadow: inset 0 0 0 1.5px currentColor; }

    /* Body: species pane + result pane */
    .flypet-gallery .fg-body { display: flex; gap: 12px; min-height: 360px; }
    .flypet-gallery .species-pane { flex: 0 0 240px; width: 240px; background: var(--fg-panel); border: 1px solid var(--fg-line); border-radius: var(--fg-radius); display: flex; flex-direction: column; min-height: 0; max-height: 70vh; transition: margin-left .25s ease; }
    .flypet-gallery.flat .species-pane { margin-left: -252px; opacity: 0; pointer-events: none; }
    .flypet-gallery .species-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px 6px; }
    .flypet-gallery .sh-title { font-size: 12px; font-weight: 700; color: var(--fg-txt-dim); letter-spacing: 1px; }
    .flypet-gallery .sh-count { font-size: 11px; color: var(--fg-txt-faint); margin-left: auto; }
    .flypet-gallery .species-search { padding: 0 12px 8px; }
    .flypet-gallery .species-search input { width: 100%; height: 34px; background: var(--fg-bg-2); border: 1px solid var(--fg-line); border-radius: 9px; color: var(--fg-txt); padding: 0 12px; font-size: 13px; outline: none; }
    .flypet-gallery .species-search input:focus { border-color: var(--fg-accent); }
    .flypet-gallery .species-list { flex: 1 1 auto; overflow-y: auto; padding: 2px 8px 12px; min-height: 0; }
    .flypet-gallery .sp-all { display: flex; align-items: center; gap: 10px; padding: 9px 10px; margin: 2px 0 6px; border-radius: 9px; cursor: pointer; border: 1px dashed var(--fg-line); min-height: 44px; }
    .flypet-gallery .sp-all:hover { border-color: var(--fg-accent); background: var(--fg-panel-2); }
    .flypet-gallery .sp-all.on { background: rgba(224,101,58,.1); border-color: var(--fg-accent); border-style: solid; }
    .flypet-gallery .sp-all .nm { font-size: 13.5px; font-weight: 700; }
    .flypet-gallery .sp-all.on .nm { color: var(--status-accent-text); }
    .flypet-gallery .sp-item { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 9px; cursor: pointer; position: relative; min-height: 44px; }
    .flypet-gallery .sp-item:hover { background: var(--fg-panel-2); }
    .flypet-gallery .sp-item.on { background: linear-gradient(90deg, rgba(224,101,58,.14), rgba(224,101,58,.03)); }
    .flypet-gallery .sp-item.on::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--fg-accent); }
    .flypet-gallery .sp-item .sp-name { flex: 1 1 auto; min-width: 0; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .flypet-gallery .sp-item.on .sp-name { color: var(--status-accent-text); }
    .flypet-gallery .sp-meta { display: flex; align-items: center; gap: 7px; flex: 0 0 auto; }
    .flypet-gallery .sp-best { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
    .flypet-gallery .sp-cnt { font-size: 11.5px; font-weight: 700; color: var(--fg-txt-dim); background: var(--fg-bg-2); border: 1px solid var(--fg-line); border-radius: 11px; min-width: 26px; height: 21px; padding: 0 7px; display: inline-flex; align-items: center; justify-content: center; }
    .flypet-gallery .sp-item.on .sp-cnt { background: var(--fg-accent); color: #fff; border-color: var(--fg-accent); }

    /* Result pane */
    .flypet-gallery .result-pane { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
    .flypet-gallery .result-head { display: flex; align-items: center; gap: 11px; flex-wrap: wrap; padding: 4px 2px 10px; border-bottom: 1px solid var(--fg-line-soft); margin-bottom: 8px; }
    .flypet-gallery .fg-back-btn { display: none; height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--fg-line); background: var(--fg-bg-2); color: var(--fg-txt); font-size: 13px; cursor: pointer; }
    .flypet-gallery .rh-title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
    .flypet-gallery .rh-title .ttl { font-size: 16px; font-weight: 700; white-space: nowrap; }
    .flypet-gallery .rh-title .sub { font-size: 12px; color: var(--fg-txt-faint); }
    .flypet-gallery .rh-title .sub b { color: var(--status-accent-text); }
    .flypet-gallery .fg-selall-btn { margin-left: auto; height: 32px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--fg-line); background: var(--fg-bg-2); color: var(--fg-txt-dim); font-size: 12.5px; font-weight: 600; cursor: pointer; }
    .flypet-gallery .fg-selall-btn:hover { border-color: var(--fg-accent); color: var(--status-accent-text); }

    /* Stage + grid + cards */
    .flypet-gallery .stage { max-height: 70vh; overflow-y: auto; padding: 2px 2px 10px; }
    .flypet-gallery .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 13px; }
    .flypet-gallery .grid.flat { margin-top: 4px; }
    .flypet-gallery .group-head { display: flex; align-items: center; gap: 11px; margin: 16px 0 10px; padding-bottom: 8px; border-bottom: 1px solid var(--fg-line-soft); }
    .flypet-gallery .group-head .ico-wrap { flex: 0 0 auto; }
    .flypet-gallery .group-head h2 { margin: 0; font-size: 15px; font-weight: 800; }
    .flypet-gallery .group-head .gcount { font-size: 12px; color: var(--fg-txt-faint); background: var(--fg-panel); padding: 2px 9px; border-radius: 20px; }
    .flypet-gallery .group-head .gsel-all { margin-left: auto; font-size: 12px; color: var(--status-accent-text); font-weight: 600; padding: 5px 10px; border-radius: 8px; background: none; border: none; cursor: pointer; }
    .flypet-gallery .group-head .gsel-all:hover { background: rgba(224,101,58,.12); }

    .flypet-gallery .card { background: linear-gradient(180deg, var(--fg-panel), var(--fg-bg-2)); border: 1px solid var(--fg-line); border-radius: var(--fg-radius); padding: 12px 12px 10px; position: relative; transition: transform .14s ease, border-color .14s, box-shadow .14s; cursor: pointer; overflow: hidden; }
    .flypet-gallery .card:hover { transform: translateY(-3px); border-color: var(--qedge, var(--fg-accent)); box-shadow: 0 8px 28px rgba(70,52,28,.16); }
    .flypet-gallery .card.sel { border-color: var(--fg-accent); box-shadow: 0 0 0 1.5px var(--fg-accent), 0 8px 28px rgba(70,52,28,.16); }
    .flypet-gallery .card.sel::after { content: "\2713"; position: absolute; top: 9px; left: 9px; z-index: 3; width: 24px; height: 24px; border-radius: 7px; background: var(--fg-accent); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
    .flypet-gallery .card-top { display: flex; align-items: flex-start; gap: 10px; }
    .flypet-gallery .card-id { flex: 1; min-width: 0; padding-top: 2px; }
    .flypet-gallery .card-name { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .flypet-gallery .card-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .flypet-gallery .mbadge { font-size: 10.5px; color: var(--fg-txt-dim); background: var(--fg-panel-2); border: 1px solid var(--fg-line-soft); border-radius: 6px; padding: 1px 7px; display: inline-flex; align-items: center; gap: 3px; }
    /* §3.2a item 3: brand orange as TEXT -> AA accent-text (#b54a23). */
    .flypet-gallery .mbadge.lv { color: var(--status-accent-text); }
    .flypet-gallery .mbadge.gen { color: var(--status-accent-text); }
    .flypet-gallery .star-row { display: flex; gap: 1px; margin-top: 5px; }
    .flypet-gallery .star-row .st { font-size: 11px; color: var(--fg-amber); }
    /* §3.2a item 4: empty star darkened (1.45:1 -> ~3:1) so empty vs filled stays distinguishable. */
    .flypet-gallery .star-row .st.off { color: var(--line-accessible); }
    .flypet-gallery .lockmark { position: absolute; top: 9px; right: 10px; font-size: 13px; z-index: 3; color: var(--fg-amber); }
    .flypet-gallery .fightmark { position: absolute; top: 9px; right: 10px; font-size: 11px; z-index: 3; background: var(--status-danger-fill); color: #fff; border-radius: 6px; padding: 1px 6px; font-weight: 700; }
    .flypet-gallery .card.has-lock.has-fight .lockmark { right: 50px; }
    .flypet-gallery .card .entries { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .flypet-gallery .card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--fg-line-soft); }
    .flypet-gallery .sel-pill { font-size: 11.5px; font-weight: 600; color: var(--fg-txt-faint); display: flex; align-items: center; gap: 6px; }
    .flypet-gallery .sel-pill .box { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid var(--fg-line); display: grid; place-items: center; font-size: 11px; }
    .flypet-gallery .card.sel .sel-pill { color: var(--fg-accent); }
    .flypet-gallery .card.sel .sel-pill .box { background: var(--fg-accent); border-color: var(--fg-accent); color: #fff; }
    .flypet-gallery .detail-link { font-size: 11.5px; color: var(--fg-txt-faint); cursor: pointer; background: none; border: none; padding: 0; font-family: inherit; }
    .flypet-gallery .detail-link:hover { color: var(--status-accent-text); }
    .flypet-gallery #gallerySentinel { height: 36px; }
    .flypet-gallery .loading-more { text-align: center; color: var(--fg-txt-faint); font-size: 12px; padding: 12px; }

    /* petIcon slot (port from B): img real icon, fallback colored avatar */
    .flypet-gallery .icon-slot { width: 64px; height: 64px; border-radius: 14px; flex: 0 0 auto; position: relative; display: grid; place-items: center; }
    .flypet-gallery .icon-slot .icon-img { width: 100%; height: 100%; border-radius: 14px; object-fit: cover; display: block; }
    .flypet-gallery .icon-slot .av { width: 100%; height: 100%; border-radius: 14px; display: grid; place-items: center; font-size: 26px; font-weight: 800; color: #fff; position: relative; overflow: hidden; text-shadow: 0 2px 6px rgba(0,0,0,.5); }
    .flypet-gallery .icon-slot .av::after { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,.22), transparent 55%); }
    .flypet-gallery .icon-slot .ring { position: absolute; inset: -3px; border-radius: 16px; border: 2.5px solid var(--qedge); pointer-events: none; }

    /* gallery entry chip (reuse .ec-N coloring from base, just spacing) */
    .flypet-gallery .entries .ec { font-size: 11px; }

    /* Batch bar */
    .flypet-gallery + .fg-batchbar, .fg-batchbar { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 160%); z-index: 60; width: min(680px, calc(100% - 28px)); background: linear-gradient(135deg, #ffffff, #faf6ee); border: 1px solid #ece3d3; border-radius: 16px; box-shadow: 0 -2px 40px rgba(70,52,28,.18); padding: 11px 14px; display: flex; align-items: center; gap: 12px; transition: transform .28s cubic-bezier(.2,.9,.3,1.2); }
    .fg-batchbar.show { transform: translate(-50%, 0); }
    .fg-batch-count { background: linear-gradient(135deg, #e0653a, #c14f2a); color: #fff; font-weight: 800; border-radius: 11px; padding: 6px 12px; font-size: 15px; white-space: nowrap; }
    .fg-batch-sub { color: #6f6657; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fg-batch-actions { margin-left: auto; display: flex; gap: 8px; flex: 0 0 auto; }
    .fg-batch-actions button { height: 40px; padding: 0 16px; border-radius: 11px; font-weight: 700; font-size: 13px; cursor: pointer; border: none; }
    .fg-b-clear { background: #faf6ee; border: 1px solid #ece3d3 !important; color: #6f6657; }
    .fg-b-clear:hover { color: #2b2620; }
    .fg-b-dissolve { background: linear-gradient(135deg, #e26b86, #b8455f); color: #fff; box-shadow: 0 4px 16px rgba(184,69,95,.35); }
    .fg-b-dissolve:hover { filter: brightness(1.1); }

    /* Filter sheet / bottom sheet */
    .fg-scrim { position: fixed; inset: 0; background: rgba(43,38,32,.45); z-index: 70; opacity: 0; pointer-events: none; transition: .2s; }
    .fg-scrim.show { opacity: 1; pointer-events: auto; }
    .fg-sheet { position: fixed; z-index: 80; top: 0; right: 0; height: 100vh; width: 360px; max-width: 90vw; background: #ffffff; border: 1px solid #ece3d3; border-radius: 18px 0 0 18px; transform: translateX(110%); transition: transform .28s cubic-bezier(.2,.9,.3,1); box-shadow: -10px 0 50px rgba(70,52,28,.18); display: flex; flex-direction: column; }
    .fg-sheet.show { transform: translateX(0); }
    .fg-sheet[aria-hidden="true"] { visibility: hidden; }
    .fg-sheet-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid #f0e9da; }
    .fg-sheet-head h3 { margin: 0; font-size: 16px; font-weight: 800; flex: 1; }
    .fg-sheet-head .reset { font-size: 12.5px; color: var(--status-accent-text); font-weight: 600; padding: 6px 10px; border-radius: 8px; background: none; border: none; cursor: pointer; }
    .fg-sheet-head .close { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; background: #faf6ee; border: none; color: #2b2620; cursor: pointer; }
    .fg-sheet-body { flex: 1; overflow-y: auto; padding: 16px 18px 30px; }
    .fg-sheet-sec { margin-bottom: 22px; }
    .fg-sheet-sec h4 { margin: 0 0 11px; font-size: 12px; font-weight: 700; color: #6f6657; text-transform: uppercase; letter-spacing: 1px; }
    .fg-chipset { display: flex; flex-wrap: wrap; gap: 7px; }
    .fg-chipset .c { padding: 8px 12px; border-radius: 9px; border: 1px solid #ece3d3; background: #fbf7ee; font-size: 12.5px; font-weight: 600; color: #6f6657; display: flex; align-items: center; gap: 7px; min-height: 40px; cursor: pointer; }
    .fg-chipset .c .dot { width: 9px; height: 9px; border-radius: 50%; }
    .fg-chipset .c.on { color: #2b2620; box-shadow: inset 0 0 0 1.5px currentColor; }
    .fg-chipset .c:hover { color: #2b2620; }
    .fg-sort-row { display: flex; flex-direction: column; gap: 6px; }
    .fg-sort-row .o { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px; border: 1px solid #ece3d3; background: #fbf7ee; min-height: 42px; font-size: 13px; font-weight: 600; color: #6f6657; cursor: pointer; }
    .fg-sort-row .o.on { border-color: #e0653a; color: #2b2620; background: rgba(224,101,58,.08); }
    .fg-sort-row .o .rd { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #ece3d3; flex: 0 0 auto; }
    .fg-sort-row .o.on .rd { border-color: #e0653a; background: radial-gradient(circle at center, #e0653a 40%, transparent 45%); }
    .fg-sheet-foot { padding: 13px 18px; border-top: 1px solid #f0e9da; display: flex; gap: 10px; }
    .fg-sheet-foot button { flex: 1; height: 46px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; border: none; }
    .fg-sheet-foot .sf-apply { background: linear-gradient(135deg, #e0653a, #c14f2a); color: #fff; }

    /* Detail drawer */
    .fg-modal-scrim { position: fixed; inset: 0; z-index: 90; background: rgba(43,38,32,.45); display: none; place-items: center; padding: 18px; }
    .fg-modal-scrim.show { display: grid; }
    .fg-modal { width: min(420px, 100%); background: #ffffff; border: 1px solid #ece3d3; border-radius: 18px; overflow: hidden; box-shadow: 0 8px 28px rgba(70,52,28,.18); }
    .fg-modal .mh { padding: 20px 22px 16px; display: flex; gap: 16px; align-items: center; position: relative; }
    .fg-modal .mh h3 { margin: 0 0 6px; font-size: 20px; font-weight: 800; }
    .fg-modal .mh .close { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 10px; background: #faf6ee; border: none; color: #2b2620; display: grid; place-items: center; font-size: 18px; cursor: pointer; }
    .fg-modal .mb { padding: 0 22px 22px; }
    .fg-modal .mb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 16px; }
    .fg-modal .mb-cell { background: #fbf7ee; border: 1px solid #f0e9da; border-radius: 10px; padding: 9px 12px; }
    .fg-modal .mb-cell .k { font-size: 11px; color: var(--color-ink-soft); }
    .fg-modal .mb-cell .v { font-size: 15px; font-weight: 700; }
    .fg-modal .mb-entries { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .fg-modal .mb-acts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .fg-modal .mb-acts2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .fg-modal .mb-acts button, .fg-modal .mb-acts2 button { height: 42px; border-radius: 11px; font-weight: 700; font-size: 13px; cursor: pointer; background: #faf6ee; border: 1px solid #ece3d3; color: #2b2620; }
    .fg-modal .mb-acts button:hover, .fg-modal .mb-acts2 button:hover { border-color: var(--fg-accent); }
    .fg-modal .mb-acts2 .dis { background: rgba(239,83,80,.12); border-color: rgba(239,83,80,.4); color: var(--status-danger-text); }

    /* Responsive */
    @media (max-width: 1023px) {
      .flypet-gallery .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 11px; }
    }
    @media (max-width: 767px) {
      /* 手機: 防止 gallery 離屏面板 (translateX(±100%)) 撐寬整頁造成水平亂滑 */
      .main { overflow-x: clip; }
      .flypet-gallery .fg-quick { display: none; }
      /* overflow:hidden 夾住滑出畫面外的 species/result 面板; min-height 放大固定矮窗緩解雙重捲動 */
      .flypet-gallery .fg-body { position: relative; overflow: hidden; min-height: 64vh; }
      .flypet-gallery .species-pane { position: absolute; inset: 0; width: 100%; flex-basis: auto; z-index: 10; max-height: none; transform: translateX(0); transition: transform .26s ease; margin-left: 0 !important; opacity: 1; pointer-events: auto; }
      .flypet-gallery .result-pane { position: absolute; inset: 0; z-index: 11; transform: translateX(100%); transition: transform .26s ease; background: var(--fg-bg-2); }
      .flypet-gallery.flat .species-pane { transform: translateX(-100%); }
      .flypet-gallery.flat .result-pane { transform: translateX(0); }
      .flypet-gallery.detail-open .species-pane { transform: translateX(-100%); }
      .flypet-gallery.detail-open .result-pane { transform: translateX(0); }
      .flypet-gallery .fg-back-btn { display: inline-block; }
      .flypet-gallery.flat .fg-back-btn { display: none; }
      .flypet-gallery .stage, .flypet-gallery .species-pane { max-height: 64vh; }
      .fg-sheet { top: auto; bottom: 0; right: 0; left: 0; width: 100%; max-width: 100%; height: auto; max-height: 86vh; border-radius: 20px 20px 0 0; transform: translateY(110%); }
      .fg-sheet.show { transform: translateY(0); }
    }
    @media (max-width: 480px) {
      .flypet-gallery .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .flypet-gallery .icon-slot { width: 56px; height: 56px; }
    }
  </style>
</head>
<body>

<a class="skip-link" href="#main">跳到主要內容</a>

<div class="toast-box" id="toasts"></div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <p id="modalMsg"></p>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="hideModal()">取消</button>
      <button class="btn btn-danger" id="modalOk">確認</button>
    </div>
  </div>
</div>

<!-- Top bar -->
<header class="topbar">
  <h1>飛寵管理</h1>
  <select id="devSel" aria-label="選擇裝置">
    <option value="emulator-5554">emulator-5554</option>
    <option value="emulator-5556">emulator-5556</option>
    <option value="7fe98fc6">7fe98fc6</option>
  </select>
  <button class="btn btn-primary" id="loadBtn" onclick="doLoad()">載入</button>
  <button class="btn btn-ghost btn-sm" id="launchBtn" onclick="doLaunch()" style="display:none;">啟動瀏覽器</button>
  <span id="loadMsg" style="font-size:0.82em; color:var(--text2);"></span>
  <nav class="topbar-right" aria-label="頁面導覽">
    <a href="/">返回中控面板</a>
    <a href="/fly-pet/logout">登出</a>
  </nav>
</header>

<main class="main" id="main">

<!-- Initial -->
<div class="empty" id="initMsg">選擇裝置後點擊「載入」</div>

<!-- Content (hidden until load) -->
<div id="content" style="display:none;">

  <!-- Pet list section (collapsible, default expanded) -->
  <div class="section">
    <div class="collapse-hdr open" role="button" tabindex="0" aria-expanded="true" aria-controls="petlistBody"
         onclick="toggleCollapse('petlist')" onkeydown="collapseKeydown(event,'petlist')">
      <span class="section-title" style="margin:0;">飛寵列表 <span style="font-weight:400;font-size:0.82em;color:var(--text2);" id="petlistSummary"></span></span>
      <span class="arrow" id="petlistArrow">&#9654;</span>
    </div>
    <div class="collapse-body open" id="petlistBody">
      <!-- ===== 飛寵列表重設計：B 卡片牆 + C 左側種類欄 (全部 scope 在 .flypet-gallery) ===== -->
      <div class="flypet-gallery" id="flypetGallery">

        <!-- Stats row (reuse ids: sTotal/sFight/sLocked/sFiltered) -->
        <div class="fg-stats" id="statsRow">
          <span class="fg-stat">全部 <b id="sTotal">0</b></span>
          <span class="fg-stat">出戰 <b id="sFight">0</b></span>
          <span class="fg-stat">鎖定 <b id="sLocked">0</b></span>
          <span class="fg-stat">篩選後 <b id="sFiltered">0</b></span>
        </div>

        <!-- 搜尋 + 視圖切換 + 進階篩選 -->
        <div class="fg-rail">
          <div class="fg-search">
            <span class="fg-si">&#128269;</span>
            <input id="gallerySearch" type="text" autocomplete="off"
              aria-label="搜尋種類或詞條名稱"
              placeholder="搜尋種類名稱或詞條名稱…（例如：炎角龍、致命一擊）">
            <button class="fg-search-clear" id="gallerySearchClear" aria-label="清除">&times;</button>
          </div>
          <div class="fg-view-toggle" id="galleryViewToggle" role="group" aria-label="顯示方式">
            <button type="button" data-view="group" class="on" aria-pressed="true">&#9636; 依種類</button>
            <button type="button" data-view="flat" aria-pressed="false">&#9776; 平鋪</button>
          </div>
          <button class="fg-filter-btn" id="galleryFilterBtn">
            &#9881; 進階 <span class="badge" id="galleryFilterBadge" style="display:none">0</span>
          </button>
        </div>

        <!-- 寵物品質 + 詞條品質快捷 (桌機) -->
        <div class="fg-quick" id="galleryQuick">
          <div class="fg-quick-grp" id="galleryPqQuick"><span class="fg-glabel">寵物品質</span></div>
          <div class="fg-quick-grp" id="galleryEqQuick"><span class="fg-glabel">詞條品質</span></div>
        </div>

        <!-- 主體：左種類欄 + 右卡片牆 -->
        <div class="fg-body" id="galleryBody">
          <aside class="species-pane" id="speciesPane">
            <div class="species-head">
              <span class="sh-title">種類索引</span>
              <span class="sh-count" id="speciesCount"></span>
            </div>
            <div class="species-search">
              <input id="speciesFilter" type="text" autocomplete="off" aria-label="篩選種類" placeholder="篩選種類…">
            </div>
            <div class="species-list" id="speciesList"></div>
          </aside>

          <section class="result-pane" id="resultPane">
            <div class="result-head">
              <button class="fg-back-btn" id="galleryBackBtn" aria-label="返回種類清單">&#8592; 返回</button>
              <div class="rh-title">
                <span class="ttl" id="rhTitle">全部飛寵</span>
                <span class="sub" id="rhSub"></span>
              </div>
              <button class="fg-selall-btn" id="gallerySelAll">全選結果</button>
            </div>
            <div class="stage" id="galleryStage"><!-- cards injected --></div>
            <div id="gallerySentinel"></div>
            <div class="empty" id="emptyMsg" style="display:none;">沒有符合條件的飛寵</div>
          </section>
        </div>

      </div><!-- /.flypet-gallery -->

      <!-- 批次操作列 (sticky) -->
      <div class="fg-batchbar" id="galleryBatchbar">
        <span class="fg-batch-count"><b id="galleryBatchN">0</b> 隻</span>
        <span class="fg-batch-sub" id="galleryBatchSub">已選取</span>
        <div class="fg-batch-actions">
          <button class="fg-b-clear" id="galleryBatchClear">取消</button>
          <button class="fg-b-dissolve" id="galleryBatchDissolve">&#9889; 分解</button>
        </div>
      </div>

      <!-- 進階篩選抽屜 / bottom sheet -->
      <div class="fg-scrim" id="galleryScrim"></div>
      <aside class="fg-sheet" id="gallerySheet">
        <div class="fg-sheet-head">
          <h3>進階篩選</h3>
          <button class="reset" id="gallerySheetReset">重設</button>
          <button class="close" id="gallerySheetClose" aria-label="關閉進階篩選">&times;</button>
        </div>
        <div class="fg-sheet-body">
          <div class="fg-sheet-sec">
            <h4>寵物品質</h4>
            <div class="fg-chipset" id="galleryPqChipset"></div>
          </div>
          <div class="fg-sheet-sec">
            <h4>詞條品質</h4>
            <div class="fg-chipset" id="galleryEqChipset"></div>
          </div>
          <div class="fg-sheet-sec">

<script>
var EQ = {1:'普通',2:'卓越',3:'史詩',4:'負面',5:'稀有',6:'變異',7:'工作'};
// 正向品質排名:用於「詞條品質」排序。史詩>卓越>稀有>普通。
// 變異(6)/工作(7) 為獨立標記、負面(4) 為缺點,皆不列入品質排名。
var POSITIVE_QUALITY_RANK = {3: 40, 2: 30, 5: 20, 1: 10};
// 同一列詞條的顯示順序(數字小=排前面):史詩→卓越→稀有→變異→工作→普通→負面(最後)。
var QUALITY_DISPLAY_ORDER = {3: 0, 2: 1, 5: 2, 6: 3, 7: 4, 1: 5, 4: 6};
var PQ = {3:'珍稀',2:'高級',1:'普通'};
var allPets = [], filtered = [], selected = new Set(), entryNames = new Set();
var sortCol = 'entry_quality', sortAsc = false;
var confirmFn = null;

function ip() { return document.getElementById('devSel').value; }
function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// per-device localStorage helper: 折疊 key/load/save 樣板 (autoBreed/presets/groups
// 三個 store 共用同一工廠,而非各自一份 copy)。
// fallback: 解析失敗或型別不符時回 fallback() 的「新」實例 (避免共用同一參考)。
function makeDeviceStore(prefix, fallback) {
  fallback = fallback || function () { return {}; };
  function key() { return prefix + ip(); }
  function load() {
    try {
      var v = JSON.parse(localStorage.getItem(key()) || 'null');
      // 型別防呆: 形狀不符 (object vs array vs ...) 一律回 fallback。
      return (v === null || typeof v !== typeof fallback()) ? fallback() : v;
    } catch (e) { return fallback(); }
  }
  function save(v) { localStorage.setItem(key(), JSON.stringify(v)); }
  return { key: key, load: load, save: save };
}

// Toast
function toast(msg, type) {
  var el = document.createElement('div');
  el.className = 'toast toast-' + (type || 'info');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 3500);
}

// Modal — routed through the shared modal manager (C1: Esc + focus move-in/trap/restore).
function showModal(title, msg, fn) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalMsg').textContent = msg;
  confirmFn = fn;
  var bg = document.getElementById('modalBg');
  if (typeof openModal === 'function') openModal(bg, { cls: 'show' });
  else bg.classList.add('show');
}
function hideModal() {
  var bg = document.getElementById('modalBg');
  if (typeof closeModal === 'function') closeModal(bg, { cls: 'show' });
  else bg.classList.remove('show');
  confirmFn = null;
}
document.getElementById('modalOk').onclick = function() { if (confirmFn) confirmFn(); hideModal(); };
// Fallback Esc only when the lib manager is absent (lib's global Esc covers the managed case).
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Escape') return;
  if (typeof closeTopModal === 'function') return;   // lib handles it
  hideModal();
});

// Loading state
function setLoading(btn, on) {
  if (on) { btn.disabled = true; btn._h = btn.innerHTML; btn.innerHTML = '<span class="spinner"></span> ...'; }
  else { btn.disabled = false; if (btn._h) btn.innerHTML = btn._h; }
}

// Entry chip HTML
function entryQuality(e) {
  if (!e) return 0;
  var q = Number(e.quality);
  return isNaN(q) ? 0 : q;
}
// 正向品質排名(變異/工作/負面 -> 0,不列入)
function positiveRank(e) {
  var q = entryQuality(e);
  return POSITIVE_QUALITY_RANK[q] || 0;
}
function bestPositiveRank(pet) {
  return Math.max.apply(null, (pet.entries || []).map(positiveRank).concat([0]));
}
function totalPositiveRank(pet) {
  return (pet.entries || []).reduce(function(sum, e) { return sum + positiveRank(e); }, 0);
}
// 同一列詞條依顯示順序排序(史詩→…→負面最後)
function sortedEntries(pet) {
  var ord = function(e) {
    var o = QUALITY_DISPLAY_ORDER[entryQuality(e)];
    return o === undefined ? 99 : o;
  };
  return (pet.entries || []).slice().sort(function(a, b) { return ord(a) - ord(b); });
}
function ecHTML(e) {
  if (!e) return '<span style="color:var(--color-ink-soft);">--</span>';
  var q = e.quality || 1;
  var tip = (EQ[q] || '') + (e.desc ? ' — ' + e.desc : '');
  return '<span class="ec ec-' + q + '" title="' + esc(tip) + '">' + esc(e.name) + '</span>';
}
function pqHTML(q) { return '<span class="pq pq-' + q + '">' + (PQ[q]||'Q'+q) + '</span>'; }

// =====================================================================
// 飛寵列表重設計 — B 卡片牆 + C 種類欄 (取代舊表格/preset/advanced)
// 沿用既有 helper: esc / sortedEntries / ecHTML / pqHTML / bestPositiveRank /
//   totalPositiveRank / EQ / PQ / POSITIVE_QUALITY_RANK / QUALITY_DISPLAY_ORDER
// =====================================================================

// 品質色語言 (與既有 --eqN / --pqN token 對齊)
var PQ_COLOR = {0:'#9aa6b2', 1:'#64b5f6', 2:'#ce93d8', 3:'#ffd54f'};
var EQ_COLOR = {1:'#64b5f6', 2:'#ffd54f', 3:'#ffe08a', 4:'#ef5350', 5:'#b9a4ff', 6:'#f0abfc', 7:'#5eead4'};

// 篩選狀態
var gState = {
  search: '',
  view: 'group',             // group | flat
  species: null,             // 選定 config_id (null = 全部)
  pq: new Set(),             // 寵物品質 0..3
  eq: new Set(),             // 詞條品質 1..7
  flags: new Set()           // lock fight hasNeg hasShine
};

// ---- 種類索引 (含每種類數量與最高品質) ----
function speciesIndex() {
  var map = {};
  allPets.forEach(function(p) {
    var k = groupKeyOf(p);
    if (!map[k]) map[k] = {key: k, config_id: p.config_id, name: p.display_name || p.name || '(?)', count: 0, best: 0};
    map[k].count++;
    if ((p.quality || 0) > map[k].best) map[k].best = (p.quality || 0);
  });
  return Object.keys(map).map(function(k) { return map[k]; }).sort(function(a, b) {
    return (b.best - a.best) || (b.count - a.count) || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
  });
}

// ---- 衍生詞條快取 (供旗標/搜尋) ----
function petEqSet(p) { return (p.entries || []).map(function(e) { return entryQuality(e); }); }
function petHasNeg(p) { return petEqSet(p).indexOf(4) >= 0; }
function petHasShine(p) {
  var s = petEqSet(p);
  return s.indexOf(3) >= 0 || s.indexOf(6) >= 0 || s.indexOf(7) >= 0;
}
function petEntryNames(p) { return (p.entries || []).map(function(e) { return e.name || ''; }).join(' '); }

// ---- petIcon: 真實遊戲圖示 (/api/fly_pet_icon/<config_id>) + 失敗退回彩色佔位頭像 ----
// 日後只要 endpoint 解析成功,<img> 就會顯示真圖;404 時 onerror 隱藏 img、露出 .av 佔位。
function petIcon(p, size) {
  size = size || 64;
  var cid = (p.config_id != null) ? p.config_id : 0;
  var hue = (cid * 37) % 360;
  var edge = PQ_COLOR[p.quality] || PQ_COLOR[0];
  var spName = p.display_name || p.name || '飛寵';
  var ch = esc(spName.charAt(0) || '?');
  var altTxt = esc(spName);   // a11y: gallery icon alt = species name (was alt="")
  var bg = 'linear-gradient(140deg, hsl(' + hue + ' 62% 46%), hsl(' + ((hue + 38) % 360) + ' 64% 32%))';
  var iconUrl = '/api/fly_pet_icon/' + encodeURIComponent(cid);
  var sty = 'width:' + size + 'px;height:' + size + 'px;';
  // onerror: 隱藏破圖、露出同槽佔位頭像 (slot 在 endpoint 404 時仍乾淨)
  var onerr = "this.style.display='none';var a=this.parentNode.querySelector('.av');if(a)a.style.display='grid';";
  return '<span class="icon-slot" style="--qedge:' + edge + ';' + sty + '">' +
    '<img class="icon-img" src="' + iconUrl + '" alt="' + altTxt + '" loading="lazy" onerror="' + onerr + '">' +
    '<span class="av" style="display:none;background:' + bg + '">' + ch + '</span>' +
    '<span class="ring" style="--qedge:' + edge + '"></span>' +
    '</span>';
}

// ---- Sort (保留 entry_quality 預設排序邏輯) ----
function doSort(col) {
  if (sortCol === col) { sortAsc = !sortAsc; }
  else { sortCol = col; sortAsc = false; }
  applyFilters();
}
function sortFiltered() {
  if (!sortCol) return;
  var key = sortCol;
  filtered.sort(function(a, b) {
    var va, vb;
    if (key === 'entries') { va = (a.entries||[]).length; vb = (b.entries||[]).length; }
    else if (key === 'entry_quality') {
      va = bestPositiveRank(a);
      vb = bestPositiveRank(b);
      if (va !== vb) return sortAsc ? (va - vb) : (vb - va);
      va = totalPositiveRank(a);
      vb = totalPositiveRank(b);
      if (va !== vb) return sortAsc ? (va - vb) : (vb - va);
      va = (a.entries||[]).length;
      vb = (b.entries||[]).length;
      if (va !== vb) return sortAsc ? (va - vb) : (vb - va);
      va = a.quality || 0;
      vb = b.quality || 0;
    }
    else { va = a[key] || 0; vb = b[key] || 0; }
    return sortAsc ? (va - vb) : (vb - va);
  });
}

// ---- 篩選判定 ----
function matchesGallery(p) {
  if (gState.species !== null && groupKeyOf(p) !== String(gState.species)) return false;
  if (gState.pq.size && !gState.pq.has(p.quality)) return false;
  if (gState.eq.size) {
    var ok = false, qs = petEqSet(p);
    gState.eq.forEach(function(q) { if (qs.indexOf(q) >= 0) ok = true; });
    if (!ok) return false;
  }
  if (gState.flags.has('lock') && !p.lock) return false;
  if (gState.flags.has('fight') && p.fight !== 1) return false;
  if (gState.flags.has('hasNeg') && !petHasNeg(p)) return false;
  if (gState.flags.has('hasShine') && !petHasShine(p)) return false;
  if (gState.search) {
    var s = gState.search;
    if ((p.display_name || p.name || '').indexOf(s) < 0 && petEntryNames(p).indexOf(s) < 0) return false;
  }
  return true;
}

// ---- Combined filter → 驅動新渲染 ----
function applyFilters() {
  filtered = allPets.filter(matchesGallery);
  sortFiltered();
  var vis = new Set(filtered.map(function(p) { return p.id; }));
  selected.forEach(function(id) { if (!vis.has(id)) selected.delete(id); });
  renderTable();
  updateStats();
  updateBatchbar();
  syncGalleryChips();
  renderSpeciesPane();
}

// updateFVals / syncPresetUI 為相容入口 (doLoad / 開頁 init 仍會呼叫):
// 重建快捷 chip 並同步狀態,等同舊版「重置篩選 UI」。
function updateFVals() { buildGalleryChips(); }
function syncPresetUI() { syncGalleryChips(); }

// ---- Grouping (by species / config_id) ----
function groupKeyOf(p) { return String(p.config_id != null ? p.config_id : ('n:' + (p.display_name || p.name || '?'))); }
function groupFiltered() {
  var map = {};
  var order = [];
  filtered.forEach(function(p) {
    var k = groupKeyOf(p);
    if (!map[k]) {
      map[k] = { key: k, name: p.display_name || p.name || '(?)', maxQ: -1, pets: [] };
      order.push(k);
    }
    var g = map[k];
    g.pets.push(p);
    if ((p.quality || 0) > g.maxQ) g.maxQ = (p.quality || 0);
  });
  return order.map(function(k) { return map[k]; }).sort(function(a, b) {
    return (b.maxQ - a.maxQ) || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
  });
}
// 點種類分組標頭 = 聚焦該 config_id (與左欄一致)
function toggleGroup(key) { selectSpecies(key); }

// ---- 卡片 HTML ----
function cardHTML(p) {
  var sel = selected.has(p.id);
  var pqc = PQ_COLOR[p.quality] || PQ_COLOR[0];
  var name = esc(p.display_name || p.name || '(?)');
  var cls = 'card';
  if (sel) cls += ' sel';
  if (p.lock) cls += ' has-lock';
  if (p.fight === 1) cls += ' has-fight';
  var entries = sortedEntries(p).map(function(e) { return ecHTML(e); }).join('');
  if (!entries) entries = '<span style="color:var(--color-ink-soft);font-size:11px;">無詞條</span>';
  var star = Math.max(0, Math.min(5, p.star || 0));
  var stars = '';
  for (var i = 0; i < 5; i++) stars += '<span class="st ' + (i < star ? '' : 'off') + '">&#9733;</span>';
  var growth = p.growth ? (p.growth / 10000).toFixed(2) : '0';
  var flagMark = p.fight === 1 ? '<span class="fightmark">出戰</span>'
               : (p.lock ? '<span class="lockmark">&#128274;</span>' : '');
  return '<article class="' + cls + '" data-id="' + p.id + '" style="--qedge:' + pqc + '"' +
      ' role="button" tabindex="0" aria-pressed="' + (sel ? 'true' : 'false') + '"' +
      ' aria-label="' + name + '，' + (sel ? '已選取' : '未選取') + '，Enter 切換選取">' +
      flagMark +
      '<div class="card-top">' + petIcon(p, 64) +
        '<div class="card-id">' +
          '<div class="card-name">' + name +
          '</div>' +
          '<div class="card-meta">' +
            '<span class="mbadge lv">Lv ' + (p.level || 0) + '</span>' +
            '<span class="mbadge gen">' + (p.generation || 0) + '代</span>' +
            '<span class="mbadge">成長 ' + growth + '</span>' +
          '</div>' +
          '<div class="star-row">' + stars + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="entries">' + entries + '</div>' +
      '<div class="card-foot">' +
        '<span class="sel-pill"><span class="box">' + (sel ? '&#10003;' : '') + '</span>' + (sel ? '已選' : '選取') + '</span>' +
        '<span style="display:flex;gap:8px;align-items:center;">' +
          '<button type="button" class="detail-link" data-group-add="' + p.id + '" aria-label="把' + name + '加入手選收藏">＋收藏</button>' +
          '<button type="button" class="detail-link" data-detail="1" aria-label="查看' + name + '詳情">詳情 &rsaquo;</button>' +
        '</span>' +
      '</div>' +
    '</article>';
}

function groupHeadHTML(g) {
  var sample = g.pets[0];
  return '<div class="group-head">' +
      '<span class="ico-wrap">' + petIcon({config_id: sample.config_id, display_name: g.name, quality: g.maxQ}, 30) + '</span>' +
      '<h2>' + esc(g.name) + '</h2>' +

    '</div>';
}

// ---- 視窗化: 60/批 IntersectionObserver (平鋪 + 群組皆視窗化) ----
var GPAGE = 60;
var _gRendered = 0;
var _gGroups = null;
var gStage = null, sentinel = null, gIO = null;

function appendFlat() {
  var grid = gStage.querySelector('.grid.flat');
  if (!grid) { grid = document.createElement('div'); grid.className = 'grid flat'; gStage.appendChild(grid); }
  var slice = filtered.slice(_gRendered, _gRendered + GPAGE);
  grid.insertAdjacentHTML('beforeend', slice.map(cardHTML).join(''));
  _gRendered += slice.length;
}
function appendGroups() {
  if (!_gGroups) return;
  var budget = GPAGE, cursor = _gRendered, seen = 0, html = '';
  for (var gi = 0; gi < _gGroups.length && budget > 0; gi++) {
    var g = _gGroups[gi];
    var gStart = seen, gEnd = seen + g.pets.length;
    seen = gEnd;
    if (gEnd <= cursor) continue;
    var localStart = Math.max(0, cursor - gStart);
    var take = Math.min(g.pets.length - localStart, budget);
    var slice = g.pets.slice(localStart, localStart + take);
    if (localStart === 0) {
      html += '<section class="grp" data-grp="' + esc(g.key) + '">' + groupHeadHTML(g) +
        '<div class="grid">' + slice.map(cardHTML).join('') + '</div></section>';
    } else {
      var sec = gStage.querySelector('section.grp[data-grp="' + cssEsc(g.key) + '"] .grid');
      if (sec) sec.insertAdjacentHTML('beforeend', slice.map(cardHTML).join(''));
    }
    cursor += take; budget -= take;
  }
  if (html) gStage.insertAdjacentHTML('beforeend', html);
  _gRendered = cursor;
}
function cssEsc(s) { return String(s).replace(/"/g, '\\"'); }
function appendNext() {
  if (gState.view === 'group' && gState.species === null) appendGroups();
  else appendFlat();
}
function topUpSentinel() {
  var guard = 0;
  while (_gRendered < filtered.length && guard++ < 200) {
    if (!sentinel) break;
    var r = sentinel.getBoundingClientRect();
    if (r.top > window.innerHeight + 600) break;
    appendNext();
  }
}

// renderTable(): 保留名稱供任何既有 caller;委派到卡片牆渲染。
function renderTable() {
  gStage = document.getElementById('galleryStage');
  sentinel = document.getElementById('gallerySentinel');
  var empt = document.getElementById('emptyMsg');
  if (!gStage) return;
  ensureGalleryObserver();
  _gRendered = 0;
  gStage.innerHTML = '';
  if (filtered.length === 0) { if (empt) empt.style.display = 'block'; updateResultHead(); return; }
  if (empt) empt.style.display = 'none';
  _gGroups = (gState.view === 'group' && gState.species === null) ? groupFiltered() : null;
  appendNext();
  updateResultHead();
  topUpSentinel();
}
function ensureGalleryObserver() {
  if (gIO || !sentinel) return;
  gIO = new IntersectionObserver(function(es) {
    es.forEach(function(e) {
      if (e.isIntersecting && _gRendered < filtered.length) appendNext();
    });
  }, {rootMargin: '600px'});
  gIO.observe(sentinel);
}

// ---- 結果頭部 ----
function updateResultHead() {
  var ttl = document.getElementById('rhTitle');

  } else {
    ttl.textContent = gState.view === 'flat' ? '平鋪 · 全部飛寵' : '全部飛寵（依種類）';
    sub.innerHTML = '共 ' + allPets.length + ' 隻 · 篩出 <b>' + filtered.length + '</b> 隻';
  }
}

// ---- 種類欄 ----
function speciesMatchesSearch(s) {
  if (!gState.search) return true;
  if (s.name.indexOf(gState.search) >= 0) return true;
  for (var i = 0; i < allPets.length; i++) {
    if (groupKeyOf(allPets[i]) !== s.key) continue;
    if (petEntryNames(allPets[i]).indexOf(gState.search) >= 0) return true;
  }
  return false;
}
function renderSpeciesPane() {
  var wrap = document.getElementById('speciesList');
  if (!wrap) return;
  var spq = (document.getElementById('speciesFilter').value || '').trim();
  var idx = speciesIndex().filter(function(s) {
    if (spq && s.name.indexOf(spq) < 0) return false;
    return speciesMatchesSearch(s);
  });
  var cntEl = document.getElementById('speciesCount');
  if (cntEl) cntEl.textContent = idx.length + ' 種 / ' + allPets.length + ' 隻';

    '</div>';

    var on = (gState.species !== null && String(gState.species) === s.key);
    var dot = PQ_COLOR[s.best] || PQ_COLOR[0];
    html += '<div class="sp-item ' + (on ? 'on' : '') + '" data-sp="' + esc(s.key) + '"' +

        petIcon({config_id: s.config_id, display_name: s.name, quality: s.best}, 32) +
        '<span class="sp-name">' + esc(s.name) + '</span>' +
        '<span class="sp-meta">' +
          '<span class="sp-best" style="background:' + dot + '" title="最高品質"></span>' +

// 點種類 (key 是 groupKeyOf 字串);null = 全部;收合左欄 == 平鋪/全部
function selectSpecies(key) {
  gState.species = (key === 'all' || key === null) ? null : key;

// ---- 視圖切換 (與種類欄收合一致) ----
function setView(view) {
  if (gState.view === view) return;
  gState.view = view;
  var g = document.getElementById('flypetGallery');
  if (g) g.classList.toggle('flat', view === 'flat');

// ---- 快捷/抽屜 chip 建構 + 同步 ----
function buildGalleryChips() {
  var pqRail = document.getElementById('galleryPqQuick');
  var pqSheet = document.getElementById('galleryPqChipset');
  var eqRail = document.getElementById('galleryEqQuick');
  var eqSheet = document.getElementById('galleryEqChipset');
  if (pqRail && pqRail.querySelectorAll('.pq-chip').length === 0) {
    var ph = '';
    [3,2,1].forEach(function(q) {
      ph += '<button class="pq-chip" data-pq="' + q + '"><span class="dot" style="background:' + PQ_COLOR[q] + '"></span>' + (PQ[q] || q) + '</button>';
    });
    pqRail.insertAdjacentHTML('beforeend', ph);
  }
  if (pqSheet && pqSheet.children.length === 0) {
    pqSheet.innerHTML = [3,2,1].map(function(q) {
      return '<button class="c" data-pq="' + q + '"><span class="dot" style="background:' + PQ_COLOR[q] + '"></span>' + (PQ[q] || q) + '色</button>';
    }).join('');
  }
  // 詞條品質順序: 1,2,3,5,6,7,4
  var eqOrder = [1,2,3,5,6,7,4];
  if (eqRail && eqRail.querySelectorAll('.eq-chip').length === 0) {
    var eh = '';
    eqOrder.forEach(function(q) {
      eh += '<button class="eq-chip" data-eq="' + q + '"><span class="dot" style="background:' + EQ_COLOR[q] + '"></span>' + (EQ[q] || q) + '</button>';
    });
    eqRail.insertAdjacentHTML('beforeend', eh);
  }
  if (eqSheet && eqSheet.children.length === 0) {
    eqSheet.innerHTML = eqOrder.map(function(q) {
      return '<button class="c" data-eq="' + q + '"><span class="dot" style="background:' + EQ_COLOR[q] + '"></span>' + (EQ[q] || q) + '</button>';
    }).join('');
  }
}
function syncGalleryChips() {
  document.querySelectorAll('#galleryPqQuick .pq-chip, #galleryPqChipset .c').forEach(function(b) {
    b.classList.toggle('on', gState.pq.has(+b.dataset.pq));
  });
  document.querySelectorAll('#galleryEqQuick .eq-chip, #galleryEqChipset .c').forEach(function(b) {
    b.classList.toggle('on', gState.eq.has(+b.dataset.eq));
  });
  document.querySelectorAll('#galleryFlagChipset .c').forEach(function(b) {
    b.classList.toggle('on', gState.flags.has(b.dataset.flag));
  });
  document.querySelectorAll('#gallerySortRow .o').forEach(function(b) {
    b.classList.toggle('on', sortCol === b.dataset.sort);
  });
  var active = gState.pq.size + gState.eq.size + gState.flags.size + (gState.species !== null ? 1 : 0);
  var badge = document.getElementById('galleryFilterBadge');
  if (badge) {
    if (active > 0) { badge.style.display = 'inline-block'; badge.textContent = active; }
    else badge.style.display = 'none';
  }
}

// ---- Selection ----
function toggleSel(id) {
  if (selected.has(id)) selected.delete(id); else selected.add(id);
  var card = gStage ? gStage.querySelector('.card[data-id="' + id + '"]') : null;
  if (card) markCardSel(card, selected.has(id));
  updateBatchbar();
}
function markCardSel(card, sel) {
  card.classList.toggle('sel', sel);
  card.setAttribute('aria-pressed', sel ? 'true' : 'false');
  var box = card.querySelector('.sel-pill .box');
  var lbl = card.querySelector('.sel-pill');
  if (box) box.innerHTML = sel ? '&#10003;' : '';
  if (lbl) lbl.lastChild.textContent = sel ? '已選' : '選取';
}
// 全選目前篩選結果
function toggleAll() {
  var allSel = filtered.length > 0 && filtered.every(function(p) { return selected.has(p.id); });
  if (allSel) filtered.forEach(function(p) { selected.delete(p.id); });
  else filtered.forEach(function(p) { selected.add(p.id); });
  renderTable();
  updateBatchbar();
}
function selectGroupKey(key) {
  filtered.forEach(function(p) { if (groupKeyOf(p) === String(key)) selected.add(p.id); });
  renderTable();
  updateBatchbar();
}

// ---- 批次列 ----
function updateBatchbar() {
  var bar = document.getElementById('galleryBatchbar');
  var n = document.getElementById('galleryBatchN');
  var sub = document.getElementById('galleryBatchSub');
  if (!bar) return;
  if (n) n.textContent = selected.size;
  if (selected.size > 0) {
    bar.classList.add('show');
    var locked = 0;
    selected.forEach(function(id) { var p = allPets.find(function(x) { return x.id === id; }); if (p && p.lock) locked++; });
    if (sub) sub.textContent = locked ? ('已選取（含 ' + locked + ' 隻鎖定，將略過）') : '已選取，待分解';
  } else {
    bar.classList.remove('show');
  }
}

function updateStats() {
  document.getElementById('sTotal').textContent = allPets.length;
  document.getElementById('sFight').textContent = allPets.filter(function(p) { return p.fight===1; }).length;
  document.getElementById('sLocked').textContent = allPets.filter(function(p) { return p.lock; }).length;
  document.getElementById('sFiltered').textContent = filtered.length;
  var el = document.getElementById('petlistSummary');
  if (el) el.textContent = '(' + allPets.length + ' 隻, 篩選 ' + filtered.length + ')';
}

function closeDetail() {

}

// ---- 事件綁定 (gallery init) ----
function initGallery() {
  var stage = document.getElementById('galleryStage');
  if (!stage || stage._wired) return;
  stage._wired = true;
  buildGalleryChips();

  // 搜尋
  var searchEl = document.getElementById('gallerySearch');
  var searchClear = document.getElementById('gallerySearchClear');
  var _t;
  if (searchEl) searchEl.addEventListener('input', function() {
    gState.search = searchEl.value.trim();
    if (searchClear) searchClear.classList.toggle('show', !!gState.search);
    clearTimeout(_t); _t = setTimeout(function() { applyFilters(); renderSpeciesPane(); }, 140);
  });
  if (searchClear) searchClear.addEventListener('click', function() {
    searchEl.value = ''; gState.search = ''; searchClear.classList.remove('show');
    applyFilters(); renderSpeciesPane();
  });

  // 視圖切換
  var vt = document.getElementById('galleryViewToggle');
  if (vt) vt.addEventListener('click', function(e) {
    var b = e.target.closest('button'); if (!b) return;
    setView(b.dataset.view);
  });

  // 種類欄
  function activateSpeciesEl(target) {
    var all = target.closest('.sp-all');
    var it = target.closest('.sp-item');
    if (all) { selectSpecies(null); return true; }
    if (it) {
      var key = it.dataset.sp;
      if (gState.species !== null && String(gState.species) === key) selectSpecies(null);
      else selectSpecies(key);
      return true;
    }
    return false;
  }
  var spList = document.getElementById('speciesList');
  if (spList) {
    spList.addEventListener('click', function(e) { activateSpeciesEl(e.target); });
    // 鍵盤化 (C8): sp-all / sp-item 為 role=button tabindex=0, Enter/Space 觸發選種類
    spList.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
      if (activateSpeciesEl(e.target)) e.preventDefault();
    });
  }
  var spFilter = document.getElementById('speciesFilter');
  if (spFilter) spFilter.addEventListener('input', function() { renderSpeciesPane(); });
  var backBtn = document.getElementById('galleryBackBtn');
  if (backBtn) backBtn.addEventListener('click', function() { selectSpecies(null); });

  // 快捷 chip (品質/詞條)
  document.getElementById('galleryPqQuick').addEventListener('click', function(e) {
    var b = e.target.closest('.pq-chip'); if (!b) return;
    var q = +b.dataset.pq; gState.pq.has(q) ? gState.pq.delete(q) : gState.pq.add(q); applyFilters();
  });
  document.getElementById('galleryEqQuick').addEventListener('click', function(e) {
    var b = e.target.closest('.eq-chip'); if (!b) return;
    var q = +b.dataset.eq; gState.eq.has(q) ? gState.eq.delete(q) : gState.eq.add(q); applyFilters();
  });

  // 卡片牆: 選取 / 詳情 / 種類全選
  stage.addEventListener('click', function(e) {
    var gsel = e.target.closest('.gsel-all');
    if (gsel) { selectGroupKey(gsel.dataset.grpKey); return; }
    var gadd = e.target.closest('[data-group-add]');
    if (gadd) { e.stopPropagation(); openAddOwnToGroup(+gadd.dataset.groupAdd); return; }
    var detail = e.target.closest('[data-detail]');
    var card = e.target.closest('.card');
    if (!card) return;
    if (detail) { openDetail(+card.dataset.id); return; }
    toggleSel(+card.dataset.id);
  });
  // 卡片牆鍵盤化 (C8): Enter/Space 在卡片=切換選取、在詳情鈕=開詳情、在種類全選鈕=全選。
  // .gsel-all 與 .detail-link 已是 <button> 原生可聚焦; .card 為 role=button tabindex=0。
  stage.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    var gsel = e.target.closest('.gsel-all');
    var gadd = e.target.closest('[data-group-add]');
    var detail = e.target.closest('[data-detail]');
    var card = e.target.closest('.card');
    if (gsel) { e.preventDefault(); selectGroupKey(gsel.dataset.grpKey); return; }
    if (gadd) { e.preventDefault(); openAddOwnToGroup(+gadd.dataset.groupAdd); return; }
    if (detail && card) { e.preventDefault(); openDetail(+card.dataset.id); return; }
    // 只有當焦點本身在卡片 (非內部原生按鈕) 時才切換選取
    if (card && e.target === card) { e.preventDefault(); toggleSel(+card.dataset.id); }
  });

  // 全選結果
  var selAll = document.getElementById('gallerySelAll');
  if (selAll) selAll.addEventListener('click', function() { toggleAll(); });

  // 批次列
  document.getElementById('galleryBatchClear').addEventListener('click', function() {
    selected.clear(); renderTable(); updateBatchbar();
  });
  document.getElementById('galleryBatchDissolve').addEventListener('click', function() { doSell(); });

  // 進階抽屜 (C1/C21): 透過 openModal/closeModal 取得 Esc 關閉 + 焦點移入/還原 + Tab trap;
  // 關閉時對離屏 sheet 設 inert + aria-hidden, 把它的 23 個控制項移出 tab order 與 a11y tree。
  var scrim = document.getElementById('galleryScrim');
  var sheet = document.getElementById('gallerySheet');
  // 初始為關閉態: 預設離屏 sheet 不可被 tab 到。
  sheet.setAttribute('aria-hidden', 'true');
  sheet.setAttribute('inert', '');
  function openSheet() {
    syncGalleryChips();
    scrim.classList.add('show');
    sheet.classList.add('show');
    sheet.removeAttribute('inert');
    if (typeof openModal === 'function') openModal(sheet, { cls: 'show' });
    else sheet.removeAttribute('aria-hidden');
  }
  function closeSheet() {
    scrim.classList.remove('show');
    if (typeof closeModal === 'function') closeModal(sheet, { cls: 'show' });
    sheet.classList.remove('show');
    sheet.setAttribute('aria-hidden', 'true');
    sheet.setAttribute('inert', '');
  }
  document.getElementById('galleryFilterBtn').addEventListener('click', openSheet);
  document.getElementById('gallerySheetClose').addEventListener('click', closeSheet);
  document.getElementById('gallerySheetApply').addEventListener('click', closeSheet);
  scrim.addEventListener('click', closeSheet);
  document.getElementById('galleryPqChipset').addEventListener('click', function(e) {
    var b = e.target.closest('.c'); if (!b) return;
    var q = +b.dataset.pq; gState.pq.has(q) ? gState.pq.delete(q) : gState.pq.add(q); applyFilters();
  });
  document.getElementById('galleryEqChipset').addEventListener('click', function(e) {
    var b = e.target.closest('.c'); if (!b) return;
    var q = +b.dataset.eq; gState.eq.has(q) ? gState.eq.delete(q) : gState.eq.add(q); applyFilters();
  });
  document.getElementById('galleryFlagChipset').addEventListener('click', function(e) {
    var b = e.target.closest('.c'); if (!b) return;
    var f = b.dataset.flag; gState.flags.has(f) ? gState.flags.delete(f) : gState.flags.add(f); applyFilters();
  });
  document.getElementById('gallerySortRow').addEventListener('click', function(e) {
    var b = e.target.closest('.o'); if (!b) return;
    sortCol = b.dataset.sort; sortAsc = false; applyFilters();
  });
  document.getElementById('gallerySheetReset').addEventListener('click', function() { resetGalleryFilters(); });

  // 詳情抽屜事件
  var dScrim = document.getElementById('galleryDetailScrim');
  dScrim.addEventListener('click', function(e) {
    if (e.target === dScrim) { closeDetail(); return; }
    var close = e.target.closest('[data-detail-close]');
    if (close) { closeDetail(); return; }
    var bBase = e.target.closest('[data-breed-base]');
    var bA = e.target.closest('[data-breed-a]');
    var bB = e.target.closest('[data-breed-b]');
    if (bBase) { document.getElementById('bBase').value = +bBase.dataset.breedBase; toast('已設定基底 #' + bBase.dataset.breedBase, 'ok'); closeDetail(); return; }
    if (bA) { setBreedPet('A', +bA.dataset.breedA); closeDetail(); return; }
    if (bB) { setBreedPet('B', +bB.dataset.breedB); closeDetail(); return; }
    var ds = e.target.closest('[data-detail-sel]');
    if (ds) { toggleSel(+ds.dataset.detailSel); renderTable(); closeDetail(); return; }
    var dd = e.target.closest('[data-detail-dissolve]');
    if (dd) { var pid = +dd.dataset.detailDissolve; closeDetail(); doSellOne(pid); return; }
    var dga = e.target.closest('[data-detail-group-add]');
    if (dga) { var gid = +dga.dataset.detailGroupAdd; closeDetail(); openAddOwnToGroup(gid); return; }
  });
}

// ---- API helpers ----
async function apiGet(url) {
  var r = await fetch(url);
  if (r.status === 401) { window.location.href = '/fly-pet/login'; throw new Error('unauthorized'); }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  var d = await r.json();
  if (d.status !== 'ok') throw new Error(d.message || 'error');
  return d;
}
async function apiPost(url, body) {
  var r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (r.status === 401) { window.location.href = '/fly-pet/login'; throw new Error('unauthorized'); }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  var d = await r.json();
  if (d.status !== 'ok') throw new Error(d.message || 'error');
  return d;
}

// ---- 輕量瀏覽器在線偵測 ----
// 直接問中控台「這台有沒有啟動瀏覽器」(CDP /json/list)，不注入遊戲 JS。
// 比 fly_pet_check_connection(評估遊戲 WS) 快很多, 且能分辨「沒開瀏覽器」與「已開、遊戲載入中」。
async function checkBrowserUp() {
  try {
    var r = await fetch('/api/fly_pet_browser_status/' + encodeURIComponent(ip()));
    if (r.status === 404) return {browser_up: true, _fallback: true};   // 端點不存在 → 不阻擋
    if (r.status === 401) { window.location.href = '/fly-pet/login'; return {browser_up: false}; }
    var d = await r.json();
    if (d.status !== 'ok') return {browser_up: false};
    return d.data || {};
  } catch(e) {
    return {browser_up: true, _fallback: true};   // 偵測失敗 → 不阻擋, 交給實際載入判斷
  }
}

async function checkBotRunning() {
  try {
    var r = await fetch('/api/fly_pet_bot_status/' + encodeURIComponent(ip()));
    if (r.status === 404) return {bot_running: false, _fallback: true};
    if (r.status === 401) { window.location.href = '/fly-pet/login'; return {bot_running: false}; }
    var d = await r.json();
    if (d.status !== 'ok') return {bot_running: false};
    return d;
  } catch(e) {
    return {bot_running: false, _fallback: true};
  }
}

// ---- Shared bot-running guard ----
// 統一破壞性 vs 唯讀操作在腳本運行中的行為:
//   block: true  -> 破壞性操作(分解),腳本運行中阻擋,回傳 {blocked:true}
//   block: false -> 唯讀操作(載入),只警示,允許繼續,回傳 {blocked:false}
// 回傳 bot 狀態 (botSt) 供呼叫端顯示細節。
async function botRunningGuard(opts) {
  opts = opts || {};
  var block = !!opts.block;
  var silent = !!opts.silent;   // 靜默: 不跳 toast(供開頁自動載入用), 仍回傳狀態
  var botSt = await checkBotRunning();
  if (!botSt.bot_running) {
    return {blocked: false, bot_running: false, botSt: botSt};
  }
  var task = botSt.bot_task || '';
  if (block) {
    toast('腳本正在運行「' + task + '」，請先暫停腳本再操作', 'err');
    return {blocked: true, bot_running: true, botSt: botSt};
  }
  if (!silent) toast('腳本正在運行「' + task + '」，操作可能互相干擾', 'err');
  return {blocked: false, bot_running: true, botSt: botSt};
}

// ---- 未連線溫和提示 (不預設瀏覽器已開) ----
// 灰字提示, 不跳紅色錯誤。kind:
//   'launch'  → 沒開瀏覽器: highlight「啟動瀏覽器」按鈕
//   'loading' → 瀏覽器已開但遊戲還在載入: 不亮啟動按鈕, 提示稍候再載入
function showNotConnectedHint(kind) {
  var msg = document.getElementById('loadMsg');
  var launchBtn = document.getElementById('launchBtn');
  var initMsg = document.getElementById('initMsg');
  if (kind === 'loading') {
    if (msg) { msg.textContent = '瀏覽器已開，遊戲載入中… 請稍候再按「載入」'; msg.style.color = 'var(--text2)'; }
    if (launchBtn) { launchBtn.style.display = 'none'; launchBtn.classList.remove('btn-attention'); }
    if (initMsg) { initMsg.textContent = '瀏覽器已開，遊戲載入中…'; initMsg.style.display = ''; }
    return;
  }
  if (msg) { msg.textContent = '尚未連線，請先「啟動瀏覽器」'; msg.style.color = 'var(--text2)'; }
  if (launchBtn) { launchBtn.style.display = 'inline-block'; launchBtn.classList.add('btn-attention'); }
  if (initMsg) { initMsg.textContent = '尚未連線 — 請先「啟動瀏覽器」，或在遊戲已開時點「載入」'; initMsg.style.display = ''; }
}

// ---- 開頁靜默偵測: 先問中控台有沒有瀏覽器, 有就載入, 沒有安靜提示, 全程不跳 toast ----
async function initAutoLoad() {
  var br = await checkBrowserUp();
  if (br.browser_up) { doLoad({silent: true}); return; }
  showNotConnectedHint('launch');
}

// ---- Launch browser ----
async function doLaunch() {
  var btn = document.getElementById('launchBtn');
  setLoading(btn, true);
  toast('正在啟動瀏覽器...', 'info');
  try {
    var r = await fetch('/api/web_launch/' + encodeURIComponent(ip()), {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({})
    });
    var d = await r.json();
    if (d.status === 'ok') {
      toast('已發送啟動請求，等待遊戲載入...', 'ok');
      document.getElementById('loadMsg').textContent = '等待遊戲載入 (約 15-30 秒)...';
      setTimeout(function() { doLoad(); }, 20000);
    } else {
      toast('啟動失敗: ' + (d.message||''), 'err');
