<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飛寵管理 · 版本 C · 種類瀏覽器</title>
<style>
/* ============ 設計語言 ============
   方向：C · 種類瀏覽器（先選類別、再看內容的雙層瀏覽）
   個性：墨青底 + 琥珀金強調，種類欄如「藏書索引」，主區如「卡片冊頁」
*/
:root{
  --bg:#0c1116;
  --bg-panel:#121a22;
  --bg-panel-2:#0f161d;
  --bg-row:#141d26;
  --bg-row-hov:#1a2632;
  --bg-row-sel:#1d2b1e;
  --line:#24323f;
  --line-soft:#1b2730;
  --txt:#e6edf3;
  --txt-dim:#8b9aa8;
  --txt-faint:#5d6b78;
  --accent:#ffb454;        /* 琥珀金主強調 */
  --accent-deep:#d98a2b;
  --accent-soft:rgba(255,180,84,.14);
  --teal:#4fd1c5;          /* 次強調（種類視圖/工作類） */
  --danger:#ef5350;
  --good:#7bd88f;
  --radius:13px;
  --radius-sm:9px;
  --tap:42px;
  --shadow:0 6px 22px -8px rgba(0,0,0,.6);
  --shadow-pop:0 14px 40px -10px rgba(0,0,0,.7);
  font-synthesis:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(1200px 600px at 100% -10%,rgba(255,180,84,.06),transparent 55%),
    radial-gradient(900px 500px at -10% 110%,rgba(79,209,197,.05),transparent 50%),
    var(--bg);
  color:var(--txt);
  font-family:"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans CJK TC",system-ui,sans-serif;
  font-size:14px;
  line-height:1.4;
  overflow:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#2a3744;border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:#39495a;}
::-webkit-scrollbar-track{background:transparent;}

/* ============ 版面骨架 ============ */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* 頂列 */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;
  background:linear-gradient(180deg,#101921,#0d141b);
  border-bottom:1px solid var(--line);
  flex:0 0 auto;
  z-index:30;
}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.brand .logo{
  width:34px;height:34px;border-radius:10px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));
  display:grid;place-items:center;font-weight:800;color:#1a1206;font-size:18px;
  box-shadow:0 2px 10px -2px rgba(255,180,84,.5);
}
.brand .t1{font-weight:700;font-size:15px;letter-spacing:.5px;}
.brand .t2{font-size:11px;color:var(--accent);letter-spacing:1.5px;font-weight:600;}

.search-wrap{flex:1 1 auto;position:relative;min-width:0;max-width:560px;}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--txt-faint);pointer-events:none;}
#search{
  width:100%;height:var(--tap);
  background:var(--bg-panel-2);
  border:1px solid var(--line);
  border-radius:11px;
  color:var(--txt);
  padding:0 38px 0 36px;font-size:14px;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
#search::placeholder{color:var(--txt-faint);}
.search-clear{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border:none;background:transparent;color:var(--txt-faint);
  border-radius:7px;font-size:16px;display:none;place-items:center;
}
.search-clear:hover{background:#1d2832;color:var(--txt);}
.search-wrap.has-val .search-clear{display:grid;}

.top-actions{display:flex;gap:8px;flex:0 0 auto;align-items:center;}

/* 視圖切換段控 */
.viewtoggle{
  display:flex;background:var(--bg-panel-2);border:1px solid var(--line);
  border-radius:10px;padding:3px;height:var(--tap);
}
.viewtoggle button{
  border:none;background:transparent;color:var(--txt-dim);
  padding:0 13px;border-radius:7px;font-size:12.5px;font-weight:600;
  display:flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap;
}
.viewtoggle button svg{width:15px;height:15px;}
.viewtoggle button.on{background:var(--accent);color:#1a1206;box-shadow:0 2px 8px -2px rgba(255,180,84,.5);}

.icon-btn{
  width:var(--tap);height:var(--tap);border-radius:10px;border:1px solid var(--line);
  background:var(--bg-panel-2);color:var(--txt-dim);display:none;place-items:center;flex:0 0 auto;
}
.icon-btn svg{width:18px;height:18px;}
.icon-btn:hover{color:var(--accent);border-color:var(--accent);}

/* 篩選列（品質藥丸 + 詞條快選） */
.filterbar{
  display:flex;align-items:center;gap:8px;
  padding:8px 16px;
  background:var(--bg-panel-2);
  border-bottom:1px solid var(--line-soft);
  flex:0 0 auto;overflow-x:auto;scrollbar-width:none;
}
.filterbar::-webkit-scrollbar{display:none;}
.fgroup{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
.fgroup .flabel{font-size:11px;color:var(--txt-faint);font-weight:600;letter-spacing:.5px;margin-right:1px;}
.fsep{width:1px;height:20px;background:var(--line);flex:0 0 auto;}
.pill{
  height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);
  background:transparent;color:var(--txt-dim);font-size:12.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.13s;
}
.pill .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
.pill:hover{border-color:#3a4a59;color:var(--txt);}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.pill.on .dot{box-shadow:0 0 0 2px rgba(255,180,84,.25);}
.pill.eq.on{background:rgba(255,255,255,.05);}
.filter-count{margin-left:auto;flex:0 0 auto;font-size:11.5px;color:var(--txt-faint);white-space:nowrap;padding-left:10px;}
.reset-btn{flex:0 0 auto;height:32px;padding:0 10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--txt-faint);font-size:12px;display:none;align-items:center;gap:5px;}
.reset-btn.show{display:inline-flex;}
.reset-btn:hover{color:var(--danger);background:rgba(239,83,80,.08);}

/* 主體 */
.body{display:flex;flex:1 1 auto;min-height:0;}

/* 左：種類欄 */
.species-pane{
  flex:0 0 282px;width:282px;
  background:var(--bg-panel);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
  transition:margin-left .25s ease,width .25s ease;
}
.species-head{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px 8px;flex:0 0 auto;
}
.species-head .sh-title{font-size:12px;font-weight:700;color:var(--txt-dim);letter-spacing:1px;}
.species-head .sh-count{font-size:11px;color:var(--txt-faint);margin-left:auto;}
.species-search{position:relative;padding:0 12px 8px;flex:0 0 auto;}
.species-search input{
  width:100%;height:36px;background:var(--bg-panel-2);border:1px solid var(--line);
  border-radius:9px;color:var(--txt);padding:0 12px 0 30px;font-size:13px;outline:none;
}
.species-search input:focus{border-color:var(--teal);}
.species-search svg{position:absolute;left:21px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--txt-faint);}
.species-list{flex:1 1 auto;overflow-y:auto;padding:2px 8px 12px;min-height:0;}

.sp-item{
  display:flex;align-items:center;gap:10px;
  padding:7px 8px;border-radius:var(--radius-sm);
  cursor:pointer;position:relative;transition:background .12s;
  min-height:46px;
}
.sp-item:hover{background:var(--bg-row-hov);}
.sp-item.on{background:linear-gradient(90deg,var(--accent-soft),rgba(255,180,84,.03));}
.sp-item.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);}
.sp-item .sp-name{flex:1 1 auto;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp-item.on .sp-name{color:var(--accent);}
.sp-meta{display:flex;align-items:center;gap:7px;flex:0 0 auto;}
.sp-best{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
.sp-cnt{
  font-size:11.5px;font-weight:700;color:var(--txt-dim);
  background:var(--bg-panel-2);border:1px solid var(--line);
  border-radius:11px;min-width:26px;height:21px;padding:0 7px;
  display:inline-flex;align-items:center;justify-content:center;
}
.sp-item.on .sp-cnt{background:var(--accent);color:#1a1206;border-color:var(--accent);}

.sp-all{
  display:flex;align-items:center;gap:10px;padding:9px 10px;margin:2px 0 6px;
  border-radius:var(--radius-sm);cursor:pointer;border:1px dashed var(--line);
  min-height:46px;transition:.12s;
}
.sp-all:hover{border-color:var(--teal);background:var(--bg-row-hov);}
.sp-all.on{background:rgba(79,209,197,.1);border-color:var(--teal);border-style:solid;}
.sp-all .ico{width:30px;height:30px;border-radius:8px;background:var(--bg-panel-2);display:grid;place-items:center;flex:0 0 auto;}
.sp-all .ico svg{width:17px;height:17px;color:var(--teal);}
.sp-all .nm{font-size:13.5px;font-weight:700;}
.sp-all.on .nm{color:var(--teal);}

/* 圖標 */
.pet-icon{
  border-radius:9px;flex:0 0 auto;position:relative;
  display:grid;place-items:center;font-weight:800;
  color:rgba(255,255,255,.92);
  text-shadow:0 1px 2px rgba(0,0,0,.5);
  overflow:hidden;
  background-clip:padding-box;
}
.pet-icon .glyph{position:relative;z-index:1;}
.pet-icon::after{ /* 玻璃高光 */
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(150deg,rgba(255,255,255,.28),rgba(255,255,255,0) 42%);
  pointer-events:none;
}

/* 右：結果區 */
.result-pane{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0;}
.result-head{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:11px 18px 9px;flex:0 0 auto;border-bottom:1px solid var(--line-soft);
}
.rh-title{display:flex;align-items:center;gap:11px;min-width:0;}
.rh-title .ttl{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rh-title .sub{font-size:12px;color:var(--txt-faint);white-space:nowrap;}
.rh-title .sub b{color:var(--accent);font-weight:700;}
.rh-spacer{flex:1 1 auto;}
.rh-tools{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.mini-btn{
  height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg-panel-2);color:var(--txt-dim);font-size:12.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;transition:.13s;white-space:nowrap;
}
.mini-btn svg{width:14px;height:14px;}
.mini-btn:hover{border-color:#3a4a59;color:var(--txt);}
.mini-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

.sort-sel{
  height:34px;background:var(--bg-panel-2);border:1px solid var(--line);
  border-radius:9px;color:var(--txt-dim);font-size:12.5px;padding:0 8px;outline:none;font-weight:600;
}

/* 滾動容器 + 視窗化 */
.scroll-area{flex:1 1 auto;overflow-y:auto;min-height:0;position:relative;padding:4px 0 90px;}
#viewport{position:relative;}
#spacer-top,#spacer-bot{height:0;}

/* 平鋪/單種類：緊湊列 */
.pet-row{
  display:flex;align-items:center;gap:12px;
  margin:5px 14px;padding:8px 10px;
  background:var(--bg-row);border:1px solid var(--line-soft);
  border-radius:var(--radius);cursor:pointer;
  transition:background .12s,border-color .12s,transform .08s;
  position:relative;
}
.pet-row:hover{background:var(--bg-row-hov);border-color:#2c3a48;}
.pet-row.sel{background:var(--bg-row-sel);border-color:#3c6b3f;}
.pet-row.sel::after{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--good);}
.pet-row.fight{box-shadow:inset 0 0 0 1px rgba(255,180,84,.35);}

.pr-check{
  width:26px;height:26px;flex:0 0 auto;border-radius:7px;border:2px solid var(--line);
  background:var(--bg-panel-2);display:grid;place-items:center;transition:.12s;position:relative;
}
.pr-check svg{width:15px;height:15px;color:#0c1116;opacity:0;transform:scale(.6);transition:.12s;}
.pet-row.sel .pr-check{background:var(--good);border-color:var(--good);}
.pet-row.sel .pr-check svg{opacity:1;transform:scale(1);}

.pr-main{flex:1 1 auto;min-width:0;}
.pr-line1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pr-name{font-size:14px;font-weight:700;white-space:nowrap;}
.pr-badge{
  font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:6px;
  display:inline-flex;align-items:center;gap:3px;line-height:1.5;
}
.b-pq{color:#0c1116;}
.b-flag{background:#202c38;color:var(--txt-dim);border:1px solid var(--line);}
.b-fight{background:var(--accent);color:#1a1206;}
.b-lock{background:#2a2030;color:#d8a;border:1px solid #4a2a40;}
.pr-line2{display:flex;align-items:center;gap:10px;margin-top:5px;font-size:11px;color:var(--txt-faint);flex-wrap:wrap;}
.pr-line2 .stat{display:inline-flex;align-items:center;gap:3px;}
.pr-line2 .stat b{color:var(--txt-dim);font-weight:700;}
.stars{color:var(--accent);letter-spacing:1px;font-size:11px;}

.pr-entries{display:flex;align-items:center;gap:5px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end;max-width:46%;}
.echip{
  font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px;
  border:1px solid transparent;white-space:nowrap;line-height:1.3;
  background:rgba(255,255,255,.04);
}
.echip.neg{text-decoration:line-through;opacity:.85;}
.echip.hot{box-shadow:0 0 0 1px currentColor inset;}

/* 種類分組視圖：每組一個橫向 cluster */
.group-block{margin:6px 14px 14px;}
.group-bar{
  display:flex;align-items:center;gap:11px;
  padding:7px 4px;cursor:pointer;position:sticky;top:0;z-index:5;
  background:linear-gradient(180deg,var(--bg) 70%,rgba(12,17,22,0));
}
.group-bar .gname{font-size:14.5px;font-weight:700;}
.group-bar .gcnt{font-size:11.5px;font-weight:700;color:var(--txt-dim);background:var(--bg-panel);border:1px solid var(--line);border-radius:11px;padding:1px 9px;}
.group-bar .gbest{font-size:11px;font-weight:700;padding:1px 8px;border-radius:6px;color:#0c1116;}
.group-bar .gspacer{flex:1 1 auto;}
.group-bar .genter{font-size:11.5px;color:var(--teal);font-weight:600;display:inline-flex;align-items:center;gap:4px;opacity:0;transition:.12s;}
.group-bar:hover .genter{opacity:1;}
.group-bar .chev{width:15px;height:15px;color:var(--txt-faint);transition:transform .15s;}
.group-block.collapsed .chev{transform:rotate(-90deg);}
.group-block.collapsed .group-grid{display:none;}
.group-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:9px;margin-top:7px;
}
.gcard{
  background:var(--bg-row);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:9px;cursor:pointer;transition:.12s;position:relative;
}
.gcard:hover{background:var(--bg-row-hov);border-color:#2c3a48;}
.gcard.sel{background:var(--bg-row-sel);border-color:#3c6b3f;}
.gcard-top{display:flex;align-items:center;gap:9px;}
.gcard .gc-name{flex:1 1 auto;min-width:0;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gc-sub{font-size:10.5px;color:var(--txt-faint);margin-top:6px;display:flex;gap:8px;}
.gc-entries{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px;}
.gc-check{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:rgba(12,17,22,.7);display:grid;place-items:center;}
.gc-check svg{width:13px;height:13px;color:#0c1116;opacity:0;}
.gcard.sel .gc-check{background:var(--good);border-color:var(--good);}
.gcard.sel .gc-check svg{opacity:1;}
.gc-more{
  margin-top:8px;height:32px;width:100%;border-radius:9px;
  border:1px dashed var(--line);background:transparent;color:var(--txt-dim);
  font-size:12px;font-weight:600;transition:.12s;
}
.gc-more:hover{border-color:var(--teal);color:var(--teal);border-style:solid;background:var(--bg-row-hov);}

/* 空狀態 / 載入更多 */
.empty{padding:60px 20px;text-align:center;color:var(--txt-faint);}
.empty .big{font-size:40px;margin-bottom:10px;opacity:.5;}
.empty .ttl{font-size:15px;color:var(--txt-dim);font-weight:600;margin-bottom:4px;}
.loadmore{margin:8px 14px 20px;display:flex;justify-content:center;}
.loadmore button{
  height:40px;padding:0 22px;border-radius:11px;border:1px solid var(--line);
  background:var(--bg-panel);color:var(--txt-dim);font-weight:600;font-size:13px;transition:.13s;
}
.loadmore button:hover{border-color:var(--accent);color:var(--accent);}

/* 批次操作列（sticky） */
.batchbar{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%) translateY(120%);
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,#1a2632,#141d26);
  border:1px solid #324352;border-radius:14px;
  padding:9px 10px 9px 16px;box-shadow:var(--shadow-pop);
  z-index:40;transition:transform .22s cubic-bezier(.2,.8,.3,1);max-width:calc(100% - 28px);
}
.batchbar.show{transform:translateX(-50%) translateY(0);}
.bb-count{font-size:13px;font-weight:700;white-space:nowrap;}
.bb-count b{color:var(--good);font-size:16px;}
.bb-sub{font-size:11px;color:var(--txt-faint);white-space:nowrap;}
.bb-actions{display:flex;gap:8px;}
.bb-btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg-panel-2);color:var(--txt-dim);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;}
.bb-btn:hover{color:var(--txt);border-color:#3a4a59;}
.bb-btn.danger{background:linear-gradient(135deg,#ef5350,#c62828);border-color:#ef5350;color:#fff;}
.bb-btn.danger:hover{filter:brightness(1.08);}
.bb-btn svg{width:15px;height:15px;}

/* 詳情 popover（點單隻） */
.overlay{position:fixed;inset:0;background:rgba(6,9,12,.6);backdrop-filter:blur(2px);z-index:60;display:none;align-items:center;justify-content:center;padding:18px;}
.overlay.show{display:flex;}
.detail{
  width:100%;max-width:420px;background:var(--bg-panel);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--shadow-pop);overflow:hidden;
}
.detail-head{display:flex;align-items:center;gap:13px;padding:16px;border-bottom:1px solid var(--line-soft);}
.detail-head .dh-name{font-size:18px;font-weight:800;}
.detail-head .dh-sp{font-size:12px;color:var(--txt-faint);}
.detail-close{margin-left:auto;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--txt-dim);font-size:18px;}
.detail-body{padding:16px;}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px;}
.dstat{background:var(--bg-panel-2);border:1px solid var(--line-soft);border-radius:10px;padding:9px 11px;}
.dstat .k{font-size:11px;color:var(--txt-faint);}
.dstat .v{font-size:15px;font-weight:700;margin-top:2px;}
.dsec-title{font-size:12px;color:var(--txt-dim);font-weight:700;letter-spacing:.5px;margin:4px 0 8px;}
.dentry{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;background:var(--bg-panel-2);border:1px solid var(--line-soft);margin-bottom:6px;}
.dentry .de-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
.dentry .de-name{font-weight:700;font-size:13.5px;}

<script>
/* === 共用 mock 資料 (3 版一致, 請勿改動 generatePets) === */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const SPECIES = ['炎角龍','碧水靈','疾風隼','岩甲獸','雷紋豹','幽影貓','晨曦鹿','熔火蠍','霜羽鶴','藤蔓妖','沙鱗蜥','星紋蝶','怒濤鯨','枯骨蛛','金鬃獅','夜瞳梟','珊瑚馬','烈陽鷹','寒月狐','毒霧蟾','翠玉龜','風暴鷲','焦土犀','銀絲蠶','深淵鰻','花靈兔','赤煉犬','冰晶鹿','雲端龍','迅雷鼠','磐石熊','溪語蛙','榴火雀','墨羽鴉','晶背龜','綠鬃馬','灼心蛾','霜牙狼','潮汐獺','虹彩魚'];
const ENTRIES = [
 {id:101,name:'攻擊強化',q:1},{id:102,name:'生命強化',q:1},{id:103,name:'防禦強化',q:1},
 {id:201,name:'暴擊提升',q:2},{id:202,name:'閃避提升',q:2},{id:203,name:'命中提升',q:2},{id:204,name:'速度提升',q:2},
 {id:301,name:'神聖庇護',q:3},{id:302,name:'狂暴之力',q:3},{id:303,name:'不滅意志',q:3},{id:304,name:'致命一擊',q:3},
 {id:401,name:'易碎',q:4},{id:402,name:'遲緩',q:4},{id:403,name:'虛弱',q:4},
 {id:501,name:'吸血',q:5},{id:502,name:'反傷',q:5},{id:503,name:'格擋',q:5},{id:504,name:'急救',q:5},
 {id:601,name:'變異·雙生',q:6},{id:602,name:'變異·狂亂',q:6},{id:603,name:'變異·永續',q:6},
 {id:701,name:'採礦工',q:7},{id:702,name:'農夫',q:7},{id:703,name:'漁夫',q:7},{id:704,name:'守衛',q:7}
];
function generatePets(){
 const rnd=mulberry32(20260605); const pets=[]; const N=312;
 for(let i=0;i<N;i++){
  const sp=Math.floor(rnd()*SPECIES.length);
  const q=rnd()<0.05?3:rnd()<0.2?2:rnd()<0.55?1:0;
  const nEntry=1+Math.floor(rnd()*4);
  const chosen={}; const entries=[];
  let guard=0;
  while(entries.length<nEntry && guard++<40){
   const e=ENTRIES[Math.floor(rnd()*ENTRIES.length)];
   if(chosen[e.id])continue; chosen[e.id]=1;
   entries.push({id:e.id,name:e.name,quality:e.q,desc:e.name+' 效果'});
  }
  pets.push({
   id:10000+i, config_id:1000+sp, display_name:SPECIES[sp], name:'',
   quality:q, level:1+Math.floor(rnd()*100), generation:1+Math.floor(rnd()*20),
   growth:Math.floor(rnd()*30000), step:Math.floor(rnd()*5),
   fight:i<6?1:0, lock:rnd()<0.08?1:0, star:Math.floor(rnd()*6), entries:entries
  });
 }
 return pets;
}
/* 品質色語言 (寵物 PQ / 詞條 EQ) */
const PQ_NAME={0:'白',1:'藍',2:'紫',3:'金'};
const PQ_COLOR={0:'#9aa6b2',1:'#64b5f6',2:'#ce93d8',3:'#ffd54f'};
const EQ_NAME={1:'普通',2:'卓越',3:'史詩',4:'負面',5:'稀有',6:'變異',7:'工作'};
const EQ_COLOR={1:'#64b5f6',2:'#ffd54f',3:'#ffe08a',4:'#ef5350',5:'#b9a4ff',6:'#f0abfc',7:'#5eead4'};
</script>

<script>
/* ===================== 應用邏輯 ===================== */
const ALL = generatePets();

/* ---- petIcon：決定性彩色頭像（hue 由 config_id 推導，PQ 色環）---- */
/* 之後接真圖只要把 .glyph 換成 <img src=...>，外層 ring/尺寸不變 */
function petIcon(pet,size){
  size = size||40;
  const hue = (pet.config_id*37)%360;
  const ring = PQ_COLOR[pet.quality];
  const ch = pet.display_name ? pet.display_name[0] : '?';
  const ringW = Math.max(2, Math.round(size/16));
  const fs = Math.round(size*0.46);
  const bg1 = `hsl(${hue} 58% 42%)`;
  const bg2 = `hsl(${(hue+34)%360} 62% 26%)`;
  return `<div class="pet-icon" style="
      width:${size}px;height:${size}px;font-size:${fs}px;
      background:linear-gradient(150deg,${bg1},${bg2});
      box-shadow:0 0 0 ${ringW}px ${ring}, 0 2px 8px -2px rgba(0,0,0,.6);
      "><span class="glyph">${ch}</span></div>`;
}
/* 詞條 chip HTML */
function entryChip(e,opts){
  opts=opts||{};
  const col = EQ_COLOR[e.quality];
  const neg = e.quality===4 ? ' neg' : '';
  const hot = (e.quality===3||e.quality===6) ? ' hot' : '';
  const small = opts.small ? 'font-size:10px;padding:2px 6px;' : '';
  return `<span class="echip${neg}${hot}" style="color:${col};border-color:${col}55;background:${col}14;${small}" title="${EQ_NAME[e.quality]}">${e.name}</span>`;
}

/* ---- 狀態 ---- */
const state = {
  view:'grouped',          // grouped | flat
  species:null,            // 選定 config_id（null=全部）
  search:'',
  pq:new Set(),            // 寵物品質
  eq:new Set(),            // 詞條品質
  st:new Set(),            // fight/lock/unlock
  sort:'quality',
  selected:new Set(),      // 已選 pet id（跨種類）
  collapsedGroups:new Set(),
  expandedGroups:new Set(),// 分組視圖：已「展開全部卡片」的種類
  flatLimit:80,            // 平鋪/單種類視窗化
  groupLimit:24            // 分組視圖一次顯示幾個種類
};
const GROUP_CARD_CAP = 4;  // 分組視圖：每個種類預設先顯示幾張卡（其餘收起，可展開），把首屏卡數壓在 ~80-100

/* ---- 種類索引（含每種類數量與最高品質）---- */
function buildSpeciesIndex(){
  const map=new Map();
  for(const p of ALL){
    let s=map.get(p.config_id);
    if(!s){s={config_id:p.config_id,name:p.display_name,count:0,best:0};map.set(p.config_id,s);}
    s.count++; if(p.quality>s.best)s.best=p.quality;
  }
  return [...map.values()].sort((a,b)=> b.best-a.best || b.count-a.count || a.config_id-b.config_id);
}
const SPECIES_INDEX = buildSpeciesIndex();

/* ---- 篩選核心：套用 search + pq + eq + st（不含 species）---- */
function matchesFilters(p){
  if(state.pq.size && !state.pq.has(p.quality)) return false;
  if(state.eq.size){
    let ok=false;
    for(const e of p.entries){ if(state.eq.has(e.quality)){ok=true;break;} }
    if(!ok) return false;
  }
  if(state.st.size){
    // 狀態為「任一符合」(OR)：fight / lock / unlock 互斥語意，命中其一即通過
    let ok=false;
    if(state.st.has('fight') && p.fight) ok=true;
    if(state.st.has('lock') && p.lock) ok=true;
    if(state.st.has('unlock') && !p.lock) ok=true;
    if(!ok) return false;
  }
  if(state.search){
    const q=state.search;
    if(p.display_name.includes(q)) return true;
    for(const e of p.entries){ if(e.name.includes(q)) return true; }
    return false;
  }
  return true;
}

/* 搜尋是否命中種類名（用於種類欄即時收斂）*/
function speciesMatchesSearch(sp){
  if(!state.search) return true;
  if(sp.name.includes(state.search)) return true;
  // 若搜尋是詞條名：該種類下有任何寵物含此詞條也算命中
  for(const p of ALL){
    if(p.config_id!==sp.config_id) continue;
    for(const e of p.entries){ if(e.name.includes(state.search)) return true; }
  }
  return false;
}

/* 取得結果集（已套 filters + species + sort）*/
function getResults(){
  let list = ALL.filter(p=>{
    if(state.species!==null && p.config_id!==state.species) return false;
    return matchesFilters(p);
  });
  const sorters={
    quality:(a,b)=> b.quality-a.quality || b.level-a.level,
    level:(a,b)=> b.level-a.level,
    gen:(a,b)=> b.generation-a.generation,
    growth:(a,b)=> b.growth-a.growth,
    entries:(a,b)=> b.entries.length-a.entries.length || b.quality-a.quality
  };
  list.sort(sorters[state.sort]||sorters.quality);
  return list;
}

/* ===================== 渲染 ===================== */
const el = id=>document.getElementById(id);
const app = el('app');

/* --- 種類欄 --- */
function renderSpecies(){
  const spq = (el('speciesFilter').value||'').trim();
  const wrap = el('speciesList');
  const totalSel = SPECIES_INDEX.filter(s=>{
    if(spq && !s.name.includes(spq)) return false;
    if(!speciesMatchesSearch(s)) return false;
    return true;
  });
  el('speciesCount').textContent = `${totalSel.length} 種 / ${ALL.length} 隻`;

  let html = `<div class="sp-all ${state.species===null?'on':''}" data-all="1">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></div>
      <div style="flex:1 1 auto"><div class="nm">全部種類</div></div>
      <span class="sp-cnt">${ALL.length}</span>
    </div>`;

  for(const s of totalSel){
    const fake={config_id:s.config_id,display_name:s.name,quality:s.best};
    html += `<div class="sp-item ${state.species===s.config_id?'on':''}" data-sp="${s.config_id}">
        ${petIcon(fake,32)}
        <span class="sp-name">${s.name}</span>
        <span class="sp-meta">
          <span class="sp-best" style="background:${PQ_COLOR[s.best]};box-shadow:0 0 6px ${PQ_COLOR[s.best]}88" title="最高品質：${PQ_NAME[s.best]}"></span>
          <span class="sp-cnt">${s.count}</span>
        </span>
      </div>`;
  }
  if(totalSel.length===0){
    html += `<div class="empty"><div class="ttl">查無種類</div><div>試試其它關鍵字</div></div>`;
  }
  wrap.innerHTML = html;
}

/* --- 結果頭部 --- */
function renderHead(results){
  const total = ALL.length;
  if(state.species!==null){
    const sp = SPECIES_INDEX.find(s=>s.config_id===state.species);
    const fake={config_id:state.species,display_name:sp.name,quality:sp.best};
    el('rhIcon').style.display='';
    el('rhIcon').outerHTML = petIcon(fake,40).replace('class="pet-icon"','class="pet-icon" id="rhIcon"');
    el('rhTitle').textContent = sp.name;
    el('rhSub').innerHTML = `此種類 ${sp.count} 隻 · 篩出 <b>${results.length}</b> 隻`;
  }else{
    const ic=el('rhIcon'); ic.style.cssText='display:none'; ic.innerHTML='';
    el('rhTitle').textContent = state.view==='flat' ? '平鋪 · 全部飛寵' : '全部飛寵（依種類）';
    const filtered = results.length;
    el('rhSub').innerHTML = `共 ${total} 隻 · 篩出 <b>${filtered}</b> 隻`;
  }
}

/* --- 平鋪/單種類：列 --- */
function petRowHTML(p){
  const sel = state.selected.has(p.id);
  const pqc = PQ_COLOR[p.quality];
  const stars = '★'.repeat(p.star)+'☆'.repeat(5-p.star);
  let badges = `<span class="pr-badge b-pq" style="background:${pqc}">${PQ_NAME[p.quality]}</span>`;
  if(p.fight) badges += `<span class="pr-badge b-fight">出戰</span>`;
  if(p.lock) badges += `<span class="pr-badge b-lock">🔒鎖</span>`;
  const entries = p.entries.map(e=>entryChip(e)).join('');
  return `<div class="pet-row ${sel?'sel':''} ${p.fight?'fight':''}" data-pet="${p.id}">
      <div class="pr-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 6"/></svg></div>
      ${petIcon(p,46)}
      <div class="pr-main">
        <div class="pr-line1">
          <span class="pr-name">${p.display_name}</span>
          ${badges}
        </div>
        <div class="pr-line2">
          <span class="stat"><b>Lv${p.level}</b></span>
          <span class="stat">第<b>${p.generation}</b>代</span>
          <span class="stat">成長 <b>${p.growth.toLocaleString()}</b></span>
          <span class="stars" title="星級">${stars}</span>
        </div>
      </div>
      <div class="pr-entries">${entries}</div>
    </div>`;
}

/* --- 分組卡片 --- */
function petCardHTML(p){
  const sel = state.selected.has(p.id);
  const pqc = PQ_COLOR[p.quality];
  const ent = p.entries.slice(0,3).map(e=>entryChip(e,{small:true})).join('');
  return `<div class="gcard ${sel?'sel':''}" data-pet="${p.id}">
      <div class="gc-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 6"/></svg></div>
      <div class="gcard-top">
        ${petIcon(p,40)}
        <div style="min-width:0">
          <div class="gc-name" style="color:${pqc}">${PQ_NAME[p.quality]}·Lv${p.level}</div>
          <div style="font-size:10.5px;color:var(--txt-faint)">第${p.generation}代 ${p.fight?'· 出戰':''} ${p.lock?'· 🔒':''}</div>
        </div>
      </div>
      <div class="gc-entries">${ent || '<span style="font-size:10px;color:var(--txt-faint)">無詞條</span>'}</div>
    </div>`;
}

/* --- 主渲染分派 --- */
function render(){
  app.classList.toggle('flat', state.view==='flat');
  renderSpecies();
  const results = getResults();
  renderHead(results);

  if(state.view==='grouped' && state.species===null){
    renderGrouped(results);
  }else{
    renderFlat(results);
  }
  updateBatchBar();
  updateFilterChrome();
}

/* 平鋪 / 單種類視窗化 */
function renderFlat(results){
  el('loadMore').style.display='none';
  const vp = el('viewport');
  if(results.length===0){
    vp.innerHTML = emptyHTML();
    return;
  }
  const limit = Math.min(state.flatLimit, results.length);
  const shown = results.slice(0,limit);
  let html = shown.map(petRowHTML).join('');
  vp.innerHTML = html;
  if(results.length>limit){
    el('loadMore').style.display='flex';
    el('loadMoreBtn').textContent = `載入更多（已顯示 ${limit} / ${results.length}）`;
  }
}

/* 單一種類 cluster 的 HTML（含 per-group 卡片視窗化）*/
function groupBlockHTML(s, pets){
  const collapsed = state.collapsedGroups.has(s.config_id);
  const expanded = state.expandedGroups.has(s.config_id);
  const bestNow = pets.reduce((m,p)=>Math.max(m,p.quality),0);
  const cap = expanded ? pets.length : Math.min(GROUP_CARD_CAP, pets.length);
  const shown = pets.slice(0, cap);
  const rest = pets.length - cap;
  const cards = shown.map(petCardHTML).join('');
  const moreBtn = rest>0
    ? `<button class="gc-more" data-expand="${s.config_id}">展開此種類全部（+${rest}）</button>`
    : (expanded && pets.length>GROUP_CARD_CAP
        ? `<button class="gc-more" data-collapse-cards="${s.config_id}">收起此種類</button>`
        : '');
  return `<div class="group-block ${collapsed?'collapsed':''}" data-gid="${s.config_id}">
      <div class="group-bar" data-gid="${s.config_id}">
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
        ${petIcon({config_id:s.config_id,display_name:s.name,quality:bestNow},30)}
        <span class="gname">${s.name}</span>
        <span class="gcnt">${pets.length}</span>
        <span class="gbest" style="background:${PQ_COLOR[bestNow]}">最高 ${PQ_NAME[bestNow]}</span>
        <span class="gspacer"></span>
        <span class="genter" data-enter="${s.config_id}">只看此種類 ›</span>
      </div>
      <div class="group-grid">${cards}</div>
      ${moreBtn}
    </div>`;
}

/* 分組視圖：每種類一個 cluster；種類數量視窗化 + 每組卡片數視窗化 */
function renderGrouped(results, appendOnly){
  const vp = el('viewport');
  if(results.length===0){ el('loadMore').style.display='none'; vp.innerHTML = emptyHTML(); return; }
  // group by config_id, 依 SPECIES_INDEX 順序
  const byId=new Map();
  for(const p of results){
    if(!byId.has(p.config_id)) byId.set(p.config_id,[]);
    byId.get(p.config_id).push(p);
  }
  const groups = SPECIES_INDEX.filter(s=>byId.has(s.config_id));
  const limit = Math.min(state.groupLimit, groups.length);

  if(appendOnly){
    // 增量掛載：只 append 尚未渲染的種類區塊，避免整體 innerHTML 重建造成重繪閃動
    const already = vp.querySelectorAll('.group-block').length;
    let html='';
    for(let gi=already; gi<limit; gi++){
      const s=groups[gi];
      html += groupBlockHTML(s, byId.get(s.config_id));
    }
    if(html) vp.insertAdjacentHTML('beforeend', html);
  }else{
    let html='';
    for(let gi=0; gi<limit; gi++){
      const s=groups[gi];
      html += groupBlockHTML(s, byId.get(s.config_id));
    }
    vp.innerHTML = html;
  }

  if(groups.length>limit){
    el('loadMore').style.display='flex';
    el('loadMoreBtn').textContent = `載入更多種類（已顯示 ${limit} / ${groups.length} 種）`;
  }else{
    el('loadMore').style.display='none';
  }
}

function emptyHTML(){
  return `<div class="empty">
    <div class="big">🔍</div>
    <div class="ttl">沒有符合的飛寵</div>
    <div>放寬品質／詞條條件，或清除搜尋</div>
  </div>`;
}

/* --- 批次列 --- */
function updateBatchBar(){
  const n=state.selected.size;
  el('bbNum').textContent=n;
  el('batchBar').classList.toggle('show', n>0);
}

/* --- 篩選 UI 狀態（藥丸 on/off + reset 顯示 + 計數）--- */
function updateFilterChrome(){
  document.querySelectorAll('.pill.pq').forEach(b=>b.classList.toggle('on',state.pq.has(+b.dataset.pq)));
  document.querySelectorAll('.pill.eq').forEach(b=>b.classList.toggle('on',state.eq.has(+b.dataset.eq)));
  document.querySelectorAll('.pill.st').forEach(b=>b.classList.toggle('on',state.st.has(b.dataset.st)));
  const active = state.pq.size+state.eq.size+state.st.size + (state.search?1:0) + (state.species!==null?1:0);
  el('resetBtn').classList.toggle('show', active>0);
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on', b.dataset.view===state.view));
  el('filterCount').textContent = active>0 ? `${active} 項條件生效` : '';
}

/* ===================== 互動 ===================== */
function setView(v){
  state.view=v;
  // 平鋪時清掉 species 鎖定（語意：看全部）
  if(v==='flat') state.species=null;
  state.flatLimit=80; state.groupLimit=24; state.expandedGroups.clear();
  el('scrollArea').scrollTop=0;
  render();
}
function selectSpecies(cid){
  state.species=cid;
  state.flatLimit=80;
  el('scrollArea').scrollTop=0;
  if(cid!==null && app.classList.contains('flat')===false) app.classList.add('detail-open'); // 手機進詳情
  render();
}
function backToSpecies(){
  state.species=null;
  app.classList.remove('detail-open');
  render();
}

/* 點種類欄 */
el('speciesList').addEventListener('click',e=>{
  const all=e.target.closest('[data-all]');
  if(all){ selectSpecies(null); app.classList.remove('detail-open'); return; }
  const it=e.target.closest('[data-sp]');
  if(it){ selectSpecies(+it.dataset.sp); }
});
el('speciesFilter').addEventListener('input',()=>renderSpecies());

/* 視圖切換（桌機段控）*/
el('viewToggle').addEventListener('click',e=>{
  const b=e.target.closest('[data-view]'); if(!b)return; setView(b.dataset.view);
});

/* 重建單一種類區塊（就地，避免整頁重畫）*/
function refreshGroupBlock(gid){
  const block = el('viewport').querySelector(`.group-block[data-gid="${gid}"]`);
  if(!block) return;
  const pets = getResults().filter(p=>p.config_id===gid);
  const s = SPECIES_INDEX.find(x=>x.config_id===gid);
  if(!s || pets.length===0){ render(); return; }
  block.outerHTML = groupBlockHTML(s, pets);
}

/* 結果區點擊：勾選 / 進詳情 / 展開組 / 進種類 */
el('viewport').addEventListener('click',e=>{
  // 分組視圖：點 group bar 的「只看此種類」
  const enter=e.target.closest('[data-enter]');
  if(enter){ selectSpecies(+enter.dataset.enter); return; }
  // 每組卡片視窗化：展開全部 / 收起
  const expand=e.target.closest('[data-expand]');
  if(expand){ state.expandedGroups.add(+expand.dataset.expand); refreshGroupBlock(+expand.dataset.expand); return; }
  const collCards=e.target.closest('[data-collapse-cards]');
  if(collCards){ state.expandedGroups.delete(+collCards.dataset.collapseCards); refreshGroupBlock(+collCards.dataset.collapseCards); return; }
  const bar=e.target.closest('.group-bar');
  if(bar && !enter){
    const gid=+bar.dataset.gid;
    if(state.collapsedGroups.has(gid)) state.collapsedGroups.delete(gid);
    else state.collapsedGroups.add(gid);
    render(); return;
  }
  // 卡片 / 列：勾選核取方塊 → 切換選取；點其它 → 詳情
  const card=e.target.closest('[data-pet]');
  if(card){
    const pid=+card.dataset.pet;
    const onCheck = e.target.closest('.pr-check') || e.target.closest('.gc-check');
    if(onCheck){ toggleSelect(pid); }
    else { openDetail(pid); }
  }
});

function toggleSelect(pid){
  if(state.selected.has(pid)) state.selected.delete(pid);
  else state.selected.add(pid);
  // 局部更新該節點 class（避免整頁重畫）
  document.querySelectorAll(`[data-pet="${pid}"]`).forEach(n=>n.classList.toggle('sel',state.selected.has(pid)));
  updateBatchBar();
}

/* 搜尋 */
const searchWrap=el('searchWrap');
el('search').addEventListener('input',e=>{
  state.search=e.target.value.trim();
  searchWrap.classList.toggle('has-val', !!state.search);
  state.flatLimit=80; state.groupLimit=24; state.expandedGroups.clear();
  render();
});
el('searchClear').addEventListener('click',()=>{
  el('search').value=''; state.search=''; searchWrap.classList.remove('has-val'); render(); el('search').focus();
});

/* 篩選藥丸（桌機）*/
el('filterbar').addEventListener('click',e=>{
  const p=e.target.closest('.pill'); if(!p)return;
  applyPillToggle(p);
});
function applyPillToggle(p){
  if(p.dataset.pq!==undefined){ toggleSet(state.pq,+p.dataset.pq); }
  else if(p.dataset.eq!==undefined){ toggleSet(state.eq,+p.dataset.eq); }
  else if(p.dataset.st!==undefined){
    const v=p.dataset.st;
    // lock 與 unlock 互斥
    if(v==='lock' && state.st.has('unlock')) state.st.delete('unlock');
    if(v==='unlock' && state.st.has('lock')) state.st.delete('lock');
    toggleSet(state.st,v);
  }
  state.flatLimit=80; state.groupLimit=24; state.expandedGroups.clear();
  render();
}
function toggleSet(set,v){ set.has(v)?set.delete(v):set.add(v); }

el('resetBtn').addEventListener('click',resetAll);
function resetAll(){
  state.pq.clear(); state.eq.clear(); state.st.clear();
  state.search=''; el('search').value=''; searchWrap.classList.remove('has-val');
  state.species=null; el('speciesFilter').value='';
  state.flatLimit=80; state.groupLimit=24; state.expandedGroups.clear();
  app.classList.remove('detail-open');
  render(); toast('已清除所有篩選','↺');
}

/* 排序 */
el('sortSel').addEventListener('change',e=>{ state.sort=e.target.value; render(); });

/* 載入更多 */
el('loadMoreBtn').addEventListener('click',()=>{
  if(state.view==='grouped' && state.species===null){
    state.groupLimit+=24;
    // 增量 append 新種類區塊，避免整體 innerHTML 重建造成既有卡片重繪閃動 / 捲動抖動
    renderGrouped(getResults(), true);
  }else{
    state.flatLimit+=80;
    render();
  }
});
/* 捲到底自動載入 */
el('scrollArea').addEventListener('scroll',e=>{
  const s=e.target;
  if(s.scrollTop+s.clientHeight > s.scrollHeight-220){
    const lm=el('loadMore');
    if(lm.style.display==='flex'){ el('loadMoreBtn').click(); }
  }
});

/* 全選結果 / 批次 */
el('selAllBtn').addEventListener('click',()=>{
  const res=getResults();
  const allSel = res.length>0 && res.every(p=>state.selected.has(p.id));
  if(allSel){ res.forEach(p=>state.selected.delete(p.id)); toast('已取消選取本結果','○'); }
  else { res.forEach(p=>state.selected.add(p.id)); toast(`已選取 ${res.length} 隻`,'✓'); }
  render();
});
el('bbClear').addEventListener('click',()=>{ state.selected.clear(); render(); });
el('bbInvert').addEventListener('click',()=>{
  const res=getResults();
  res.forEach(p=>{ state.selected.has(p.id)?state.selected.delete(p.id):state.selected.add(p.id); });
  render();
});
el('bbDissolve').addEventListener('click',()=>{
  const n=state.selected.size; if(!n)return;
  const locked=[...state.selected].filter(id=>ALL.find(p=>p.id===id)?.lock).length;
  // no-op：實際後端動作只做 toast + console
  console.log('[mock] 分解 dissolve →', [...state.selected]);
  toast(`（示意）將分解 ${n} 隻${locked?`，其中 ${locked} 隻已鎖定會跳過`:''}`,'🗑');
});

/* --- 詳情 popover --- */
function openDetail(pid){
  const p=ALL.find(x=>x.id===pid); if(!p)return;
  const sel=state.selected.has(pid);
  const pqc=PQ_COLOR[p.quality];
  const stars='★'.repeat(p.star)+'☆'.repeat(5-p.star);
  const entries=p.entries.map(e=>{
    const c=EQ_COLOR[e.quality];
    const neg=e.quality===4?'style="text-decoration:line-through;opacity:.8"':'';
    return `<div class="dentry">
      <span class="de-dot" style="background:${c}"></span>
      <span class="de-name" ${neg}>${e.name}</span>
      <span class="de-q" style="background:${c}22;color:${c}">${EQ_NAME[e.quality]}</span>
    </div>`;
  }).join('');
  el('detail').innerHTML = `
    <div class="detail-head">
      ${petIcon(p,52)}
      <div>
        <div class="dh-name" style="color:${pqc}">${p.display_name}</div>
        <div class="dh-sp">#${p.id} · ${PQ_NAME[p.quality]}品質 · <span class="stars" style="color:var(--accent)">${stars}</span></div>
      </div>
      <button class="detail-close" id="dClose">✕</button>
    </div>
    <div class="detail-body">
      <div class="dgrid">
        <div class="dstat"><div class="k">等級</div><div class="v">Lv ${p.level}</div></div>
        <div class="dstat"><div class="k">世代</div><div class="v">第 ${p.generation} 代</div></div>
        <div class="dstat"><div class="k">成長值</div><div class="v">${p.growth.toLocaleString()}</div></div>
        <div class="dstat"><div class="k">階段 / 狀態</div><div class="v">step ${p.step} ${p.fight?'· 出戰':''} ${p.lock?'· 🔒鎖定':''}</div></div>
      </div>
      <div class="dsec-title">詞條（${p.entries.length}）</div>
      ${entries}
    </div>
    <div class="detail-foot">
      <button class="${sel?'df-sel':''}" id="dSel">${sel?'✓ 已選取':'加入選取'}</button>
      <button class="df-dis" id="dDis">分解此隻</button>
    </div>`;
  el('overlay').classList.add('show');
  el('dClose').onclick=closeDetail;
  el('dSel').onclick=()=>{ toggleSelect(pid); closeDetail(); };
  el('dDis').onclick=()=>{
    if(p.lock){ toast('此飛寵已鎖定，無法分解','🔒'); return; }
    console.log('[mock] 分解單隻 →',pid);
    toast(`（示意）分解 ${p.display_name} #${pid}`,'🗑'); closeDetail();
  };
}
function closeDetail(){ el('overlay').classList.remove('show'); }
el('overlay').addEventListener('click',e=>{ if(e.target===el('overlay')) closeDetail(); });

/* --- 返回鍵（手機）--- */
el('backBtn').addEventListener('click',()=>{
  if(state.view==='flat'){ /* 平鋪沒有種類欄，返回=回到分組 */ setView('grouped'); }
  else backToSpecies();
});

/* --- 篩選抽屜（手機）--- */
function buildDrawer(){
  el('drawerBody').innerHTML = `
    <div class="drawer-sec">
      <div class="st">種類視圖</div>
      <div class="drawer-pills">
        <button class="pill dv ${state.view==='grouped'?'on':''}" data-dv="grouped">依種類分組</button>
        <button class="pill dv ${state.view==='flat'?'on':''}" data-dv="flat">平鋪全部</button>
      </div>
    </div>
    <div class="drawer-sec">
      <div class="st">寵物品質</div>
      <div class="drawer-pills">
        ${[3,2,1,0].map(q=>`<button class="pill pq ${state.pq.has(q)?'on':''}" data-pq="${q}"><span class="dot" style="background:${PQ_COLOR[q]}"></span>${PQ_NAME[q]}</button>`).join('')}
      </div>
    </div>
    <div class="drawer-sec">
      <div class="st">詞條品質</div>
      <div class="drawer-pills">
        ${[3,6,5,7,4,2,1].map(q=>`<button class="pill eq ${state.eq.has(q)?'on':''}" data-eq="${q}"><span class="dot" style="background:${EQ_COLOR[q]}"></span>${EQ_NAME[q]}</button>`).join('')}
      </div>
    </div>
    <div class="drawer-sec">
      <div class="st">狀態</div>
      <div class="drawer-pills">
        <button class="pill st ${state.st.has('fight')?'on':''}" data-st="fight">出戰</button>
        <button class="pill st ${state.st.has('lock')?'on':''}" data-st="lock">已鎖定</button>
        <button class="pill st ${state.st.has('unlock')?'on':''}" data-st="unlock">未鎖定</button>
      </div>
    </div>
    <div class="drawer-sec">
      <div class="st">排序</div>
      <div class="drawer-pills">
        ${[['quality','品質'],['level','等級'],['gen','世代'],['growth','成長'],['entries','詞條數']].map(([v,t])=>`<button class="pill so ${state.sort===v?'on':''}" data-so="${v}">${t}↓</button>`).join('')}
      </div>
    </div>
    <button class="pill" id="drawerReset" style="width:100%;height:42px;justify-content:center;color:var(--danger);border-color:rgba(239,83,80,.4)">清除全部篩選</button>`;
}
el('drawerBody').addEventListener('click',e=>{
  const dv=e.target.closest('[data-dv]');
  if(dv){ setView(dv.dataset.dv); buildDrawer(); return; }
  const so=e.target.closest('[data-so]');
  if(so){ state.sort=so.dataset.so; el('sortSel').value=so.dataset.so; render(); buildDrawer(); return; }
  const p=e.target.closest('.pill.pq,.pill.eq,.pill.st');
  if(p){ applyPillToggle(p); buildDrawer(); return; }
  if(e.target.id==='drawerReset'){ resetAll(); buildDrawer(); }
});
function openDrawer(){ buildDrawer(); el('drawer').classList.add('show'); el('drawerScrim').classList.add('show'); }
function closeDrawer(){ el('drawer').classList.remove('show'); el('drawerScrim').classList.remove('show'); }
el('filterBtn').addEventListener('click',openDrawer);
el('drawerDone').addEventListener('click',closeDrawer);
el('drawerScrim').addEventListener('click',closeDrawer);

/* --- 說明關閉 --- */
el('noteClose').addEventListener('click',()=>el('note').classList.add('hide'));

/* --- toast --- */
let toastTimer=null;
function toast(msg,icon){
  el('toastMsg').textContent=msg; el('toastIcon').textContent=icon||'✓';
  const t=el('toast'); t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* --- ESC 關閉 --- */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeDetail(); closeDrawer(); }
});

/* 初次渲染 */
render();
console.log(`[版本 C · 種類瀏覽器] 載入 ${ALL.length} 隻飛寵 / ${SPECIES_INDEX.length} 種類`);
</script>
</body>
</html>
